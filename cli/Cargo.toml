# The CLI workspace (ADR-0019 Am. 3): the CLI lives outside apps/ as a
# Rust workspace — per-OS static binaries are the distribution goal, and
# a workspace is the shape a multi-crate CLI grows into.
[workspace]
resolver = "2"
members = ["fluxvale-cli"]

[workspace.package]
edition = "2024"
license = "FSL-1.1-ALv2"
