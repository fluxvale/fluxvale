# FluxVale app catalog seed data.
#
# Adding an app is purely additive: append an entry (or a category) and
# re-run seeds — FluxVale.Seeds.seed_catalog!/0 converges existing rows to
# match the YAML, idempotently. Everything is validated at write time by the
# resources: malformed entries or env-var specs fail loudly
# (lib/flux_vale/contexts/catalog/types/env_var_schema.ex).
#
# Lookup keys — never rename an existing entry: category/app slug, and
# app_id+version for versions. Renaming orphans the old row instead of
# converging it.
#
# Field notes: default_cpu_cores is a QUOTED string (preserves Decimal
# precision). Optional version fields default to healthcheck_path "/",
# storage_mount_path "/data", default_memory_mb 256, default_storage_gb 0,
# published_at nil, env maps %{}, first_run nil (a version without a
# first-run contract must simply be usable out of the box — see ADR-0034
# for the next app's pattern).
# recommended_size is REQUIRED on every version — a slug from
# pricing_data.yaml whose COMPUTE equals the version's cpu/memory
# defaults (#558: default_storage_gb is the app's own honest storage
# default, priced per GB); seed_pricing! runs first and the seed
# runner resolves the id.
- category:
    name: Developer Tools
    slug: developer-tools
    description: >-
      Source control and developer productivity apps.
    # #611 (D5, plan §7.3): the audience line every app page in the
    # category renders as its hero's "who it suits" paragraph.
    audience: >-
      A fit for teams that want their own source control and CI without
      running the servers.
  apps:
    - name: Forgejo
      slug: forgejo
      tagline: Git forge with issues, pull requests, and Actions CI
      description: |
        Repositories, issues, pull requests, wiki, and Forgejo Actions CI in
        a lightweight, 100% free-software package. Git over HTTPS only, with
        repositories and metadata living on a dedicated volume.
      icon_url: https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/assets/logo.svg
      source_url: https://codeberg.org/forgejo/forgejo
      docs_url: https://forgejo.org/docs/latest/
      # #611 S1 retro-fill (plan §8.2): facts promoted from the
      # description, release notes, and the packaging decisions —
      # nothing invented. Alternatives are names only.
      caveats:
        - Git works over HTTPS only. SSH pushes and pulls are disabled on every instance.
        - Email sending is off until you enable it with SMTP settings at deploy.
        - Storage runs on SQLite on the instance volume. There is no external database option.
      alternatives:
        - GitHub
        - GitLab
      # #611 S7: the curated in-action copy, captured from a running
      # instance (repository with README + issue tracker).
      community_url: https://matrix.to/#/#forgejo:matrix.org
      in_action_intro: >-
        Forgejo as it ships here: a repository with its README, open
        issues and git over HTTPS.
      screenshots:
        - src: /images/catalog/forgejo/repository-readme.png
          alt: A Forgejo repository home with the README rendered beside the file list
          caption: A repository with its README, file list and history.
        - src: /images/catalog/forgejo/issues.png
          alt: The Forgejo issue tracker listing three open issues
          caption: The issue tracker, where work gets picked up.
      features:
        - icon: hero-code-bracket
          title: Git hosting with pull requests
          body: Repositories, issues, pull requests and Forgejo Actions CI in one lightweight package.
        - icon: hero-shield-check
          title: HTTPS-only git by default
          body: Git works over HTTPS on every instance. Repositories and metadata live on a dedicated volume.
        - icon: hero-user-group
          title: Organizations and teams
          body: Organizations, teams and per-repository permissions ship with the forge.
        - icon: hero-arrow-path
          title: Pinned upstream releases
          body: Instances run an upstream stable release, so you know exactly what you are running.
      faq:
        - question: How do I set up Forgejo?
          answer: Open the instance URL and register. The first account becomes the admin.
        - question: Is SSH supported?
          answer: No. Git works over HTTPS only in this packaging, and SSH pushes are disabled.
        - question: Can I import existing repositories?
          answer: Yes. Forgejo ships migration tools that pull repositories and issues over HTTPS.
      versions:
        - version: "16.0.5"          # upstream stable, 2026-09-17
          image: codeberg.org/forgejo/forgejo:16.0.5
          port: 3000
          healthcheck_path: /api/healthz
          # #73's deploy op sets this to the instance's public URL —
          # Forgejo needs ROOT_URL for correct absolute links behind the
          # proxy.
          instance_url_env: FORGEJO__server__ROOT_URL
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # the callback URL registered on the Pocket ID client is the
          # instance URL plus this path. The path's third segment is the
          # authentication source's name, and Forgejo stores that config
          # in its own database (Site Administration → Authentication
          # Sources — no env surface), so the guide pins the name
          # `PocketID` to keep the two ends matching.
          oidc_callback_path: /user/oauth2/PocketID/callback
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′).
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v16.0.5.
            HTTPS-only git (SSH disabled). SQLite on a dedicated volume.
          published_at: "2026-09-17T15:27:32Z"
          # Operator-owned config (#71 scope, ADR-0031 M3): SQLite-on-PVC
          # (no CNPG dependency — the single cluster is platform-only,
          # ADR-0009); SSH disabled — the v1 port-22 lesson. #73's deploy
          # op adds FORGEJO__server__ROOT_URL per instance (the ingress
          # URL isn't catalog data). INSTALL_LOCK lives in the first-run
          # contract below — it is first-open posture, not operator
          # preference.
          default_env_vars:
            FORGEJO__database__DB_TYPE: sqlite3
            FORGEJO__server__DISABLE_SSH: "true"
          # First-run contract (#181, ADR-0034): registration is open on
          # first boot and the first registrant becomes admin.
          # DISABLE_REGISTRATION is deliberately NOT shipped — Forgejo
          # defaults it to false (open), and __section__KEY env re-applies
          # to app.ini at every container start, so pinning it would
          # silently re-open registration after the owner closes it
          # in-app. The forbidden_env lock keeps every deploy-time layer
          # from setting it at all.
          first_run:
            pattern: first_registered_user_admin
            env:
              FORGEJO__security__INSTALL_LOCK: "true"
            forbidden_env:
              - FORGEJO__service__DISABLE_REGISTRATION
            # #611 D10: plain sentences, no em dashes or semicolons.
            guidance: >-
              Open the instance URL and register. The first account
              becomes the admin. Once you are in, close public sign-up
              in Forgejo's site administration settings.
          # Deploy-time user settings — rendered by the #74 deploy form.
          configurable_env_vars:
            FORGEJO__mailer__ENABLED:
              label: Enable email sending
              description: Send notifications and confirmation emails via SMTP.
              type: boolean
              default: false
            FORGEJO__mailer__SMTP_ADDR:
              label: SMTP host
              description: Hostname of the SMTP server.
              type: string
            FORGEJO__mailer__SMTP_PORT:
              label: SMTP port
              description: Port of the SMTP server.
              type: integer
              default: 587
            FORGEJO__mailer__FROM:
              label: Sender address
              description: From address for outgoing mail, e.g. Forgejo <noreply@example.com>.
              type: string
            FORGEJO__mailer__USER:
              label: SMTP username
              description: Username for SMTP authentication.
              type: string
            FORGEJO__mailer__PASSWD:
              label: SMTP password
              description: Password for SMTP authentication.
              type: string
              secret: true

- category:
    name: Media & Entertainment
    slug: media
    description: >-
      Media and reading servers for your own library.
    audience: >-
      A fit for personal libraries and households that want their own
      media server.
  apps:
    - name: Kavita
      slug: kavita
      tagline: Digital library for comics, manga, and ebooks
      description: |
        A fast, cross-platform reading server for a personal digital library
        of comics, manga, and ebooks, with a polished in-browser reader,
        per-user reading progress, OPDS support for third-party clients, and
        OIDC SSO. All configuration happens in the web UI and no environment
        variables are needed to boot.
      icon_url: https://raw.githubusercontent.com/Kareadita/Kavita/develop/Logo/kavita.svg
      source_url: https://github.com/Kareadita/Kavita
      docs_url: https://wiki.kavitareader.com
      # #611 S1 retro-fill (plan §8.2): the file-ingest and scan facts
      # from the entry's own packaging notes, plus the first-open claim
      # posture the contract below carries. #679 adds the folder-layout
      # fact the scanner enforces.
      caveats:
        - Library files move in over WebDAV file access. There is no in-app upload path.
        - Library files must sit in subfolders of the library folder, one per book or series. Loose files at the folder's root never appear in scans.
        - First library scans generate covers with image processing, so a big library takes time.
        - The first account registered becomes the admin. Claim the instance right after deploying.
      alternatives:
        - Komga
        - Calibre-Web
      # #611 S7: the curated in-action copy, captured from a running
      # instance (runbook §3 kavita fallback screens: the server admin
      # screens — see the PR body for the capture posture).
      community_url: https://github.com/Kareadita/Kavita/discussions
      in_action_intro: >-
        Kavita's admin screens after setup, captured from a running
        instance.
      screenshots:
        - src: /images/catalog/kavita/libraries.png
          alt: The Kavita server settings listing the Books library ready to scan
          caption: Server settings, where libraries are created and scanned.
        - src: /images/catalog/kavita/users.png
          alt: The Kavita users screen listing the instance admin
          caption: Users and roles live in the same admin panel.
      features:
        - icon: hero-book-open
          title: Ebooks, comics and manga in one server
          body: Epub, pdf and comic archives stream to a polished in-browser reader.
        - icon: hero-user-group
          title: Progress for every reader
          body: Each account keeps its own reading progress, wants-to-read list and history.
        - icon: hero-share
          title: OPDS for your reader apps
          body: OPDS support lets third-party reader apps browse and download from the library.
        - icon: hero-magnifying-glass
          title: Search the whole library
          body: Series, people and genres become searchable as soon as a scan finishes.
      faq:
        - question: How do I set up Kavita?
          answer: Open the instance URL and register. The first account becomes the admin.
        - question: How do files get in?
          answer: Library files move in over WebDAV file access. There is no in-app upload path.
        - question: Why is my series grid empty?
          answer: A scan only sees files inside subfolders of the library folder, one per book or series. Upload over WebDAV into subfolders, then scan again from Server settings.
      # File access (#190, ADR-0035): Kavita is the flagship file-access
      # app — the whole point is loading your own library. The sidecar
      # serves the volume at the app's declared mount path, so libraries
      # Kavita points into the volume are all reachable via /dav.
      file_access: true
      versions:
        - version: "0.9.1"          # upstream stable, 2026-09-02 (assembly 0.9.1.4)
          # The canonical image: built and pushed by Kavita's own release
          # workflow (release-workflow.yml) — jvmilazz0/kavita on Docker
          # Hub is the same workflow's second target, not a distinct build.
          # Tag is major.minor: upstream tags stable releases by the
          # truncated assembly version, so `0.9.1` is what the workflow
          # publishes for 0.9.1.4.
          image: ghcr.io/kareadita/kavita:0.9.1
          port: 5000
          healthcheck_path: /api/health
          # Kavita's persistent state is NOT on the volume root: it
          # resolves its config dir from the container's working
          # directory (/kavita), so the SQLite DB, JWT signing key,
          # covers and backups only survive a pod restart when the PVC
          # lands at /kavita/config (#189). The deployer's per-version
          # mount path makes that catalog data instead of a special case.
          storage_mount_path: /kavita/config
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # Kavita's OIDC setup (Settings → Server → OpenID Connect) is
          # in-app with a restart to apply, no env surface. The guide's
          # optional logout callback is /signout-callback-oidc.
          oidc_callback_path: /signin-oidc
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′).
          # Kavita runs on as little as 256 MB (upstream guidance), but
          # library scans are image-heavy (NetVIPS cover generation), so
          # the shipped recommendation keeps scan headroom.
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v0.9.1
            (0.9.1.4). SQLite on a dedicated volume mounted at
            /kavita/config. The admin account is created on first open.
          published_at: "2026-09-02T21:07:38Z"
          # First-run contract (#189, ADR-0034): Kavita's first boot
          # shows the registration page and POST /api/account/register
          # makes the first registrant the admin — its own UI redirects
          # to /register until an admin exists, so claiming is one click.
          # There are no env knobs to pin or lock: all configuration
          # (including closing sign-up) lives in Kavita's admin UI, so
          # `env` and `forbidden_env` are both empty.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            # #611 D10: plain sentences, no em dashes or semicolons. The
            # file-access clause states what ships (#190), not the
            # "upcoming" wording this replaces.
            guidance: >-
              Open the instance URL and register. The first account
              becomes the admin. Kavita is then yours to configure in
              its own admin settings. A library scan needs files on the
              server first, which file access over WebDAV provides.
              Uploaded books must sit in subfolders of the library
              folder, one per book or series, or scans will not see
              them.

- category:
    name: Productivity
    slug: productivity
    # #610: widened from "Notes and personal knowledge apps." when
    # Vikunja joined — tasks and projects are the category's second
    # half now.
    description: >-
      Notes, tasks, and personal knowledge apps.
    audience: >-
      A fit for people who want their notes and tasks in one place, on
      their own terms.
  apps:
    - name: Memos
      slug: memos
      tagline: Lightweight note stream for your everyday thoughts
      description: |
        A fast, self-hosted note stream for quick thoughts, lists, and
        links. Memos are Markdown, stay private until you share them,
        and are searchable by tag and date. The web UI is at home on
        phones and desktops, and everything is stored in a single
        SQLite database on the instance volume.
      icon_url: https://raw.githubusercontent.com/usememos/memos/main/web/public/logo.svg
      source_url: https://github.com/usememos/memos
      docs_url: https://usememos.com/docs
      # #611 S1 retro-fill (plan §8.2): the storage and first-open facts
      # from the description and the first-run contract below.
      caveats:
        - Everything is stored in a single SQLite database on the instance volume.
        - The first account created becomes the host admin. Claim it before sharing the URL.
      alternatives:
        - Google Keep
        - Joplin
      # #611 S7: the curated in-action copy, captured from a running
      # instance (timeline feed + the launch tag view).
      community_url: https://github.com/usememos/memos/discussions
      in_action_intro: >-
        A fresh Memos instance with its first notes, captured from a
        running instance.
      screenshots:
        - src: /images/catalog/memos/memos-feed.png
          alt: The Memos timeline with three notes and the composer on top
          caption: Notes land in a single feed, newest first.
        - src: /images/catalog/memos/tag-view.png
          alt: The Memos view filtered to the launch tag with two notes
          caption: Notes carrying a tag collect in one view.
      features:
        - icon: hero-tag
          title: Hashtags that filter
          body: Markdown notes carry hashtags, and every tag opens a filtered view.
        - icon: hero-share
          title: Private until you share
          body: Notes stay private to your account until you switch them to public.
        - icon: hero-device-phone-mobile
          title: Works from phone and desktop
          body: The web UI adapts to small screens, so quick notes work anywhere.
        - icon: hero-magnifying-glass
          title: Search by tag and date
          body: The timeline is searchable by tag and date range out of the box.
      faq:
        - question: How do I set up Memos?
          answer: Open the instance URL and create your account. The first account becomes the host.
        - question: Where is my data stored?
          answer: Everything lives in a single SQLite database on the instance volume.
        - question: Can I close public sign-up?
          answer: Yes. Turn off registration in Memos' admin settings after you claim the host account.
      versions:
        - version: "26.11.0"          # upstream stable, 2026-11-01
          # The canonical image: built and pushed by Memos' own release
          # workflow (release.yml) to Docker Hub and GHCR under the same
          # tags. Exact calendar-version tag, like Forgejo's pin.
          image: ghcr.io/usememos/memos:26.11.0
          port: 5230
          healthcheck_path: /healthz
          # The image's own VOLUME: the SQLite DB (memos_prod.db) and
          # attachments live under /var/opt/memos, which is also the
          # container's working directory, so the PVC mounts exactly
          # there (the Kavita reasoning — state must land under the
          # app's own paths to survive a pod restart).
          storage_mount_path: /var/opt/memos
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # Memos' SSO settings (Settings → SSO, the Custom template)
          # are in-app, with the authorization, token, and userinfo
          # endpoints entered explicitly because Memos reads no
          # discovery URL. The identifier maps to preferred_username
          # (Pocket ID's own Memos guide).
          oidc_callback_path: /auth/callback
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB
          # — exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′). Memos is a
          # static Go binary over SQLite with
          # no external services; upstream's whole pitch is featherweight,
          # so the ladder's floor is honest headroom, not a squeeze.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream 26.11.0.
            SQLite on a dedicated volume mounted at /var/opt/memos. The
            host account is created on first open.
          published_at: "2026-11-01T14:04:41Z"
          # First-run contract (#181, ADR-0034): Memos boots into
          # first-user setup mode — the first account created becomes
          # the host (admin). Registration is open by default
          # (upstream's own test suite pins it) and is closed in the
          # admin UI afterwards; that toggle is a stored instance
          # setting with no env override, so there is no env key to pin
          # or lock — `env` and `forbidden_env` are both empty, the
          # Kavita shape.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            guidance: >-
              Open the instance URL and create your account. The first
              account becomes the host (admin). Then close public
              sign-up in Memos' admin settings so no one else can
              register.

    - name: Vikunja
      slug: vikunja
      tagline: Task lists, boards, and projects for your household or team
      description: |
        The to-do app from the Vikunja project. Tasks live in projects
        with list, kanban, Gantt, and table views, plus labels,
        filters, reminders, and repeating tasks. Share a project with
        the household or a team, comment on tasks, and attach files.
        Phone and desktop clients connect over CalDAV. Everything is
        stored in a SQLite database on the instance volume and the
        whole thing runs as one small Go binary. Sign-ups stay open on
        the instance URL, so create your account soon after deploying.
      # The repo's apple-touch-icon is the self-contained mark (the
      # ActualBudget/Umami lesson): the llama glyph on a solid blue
      # field, so it reads on the icon tile in both themes. The
      # originalMedia logo.svg is the glyph alone on transparency.
      icon_url: https://raw.githubusercontent.com/go-vikunja/vikunja/v2.8.0/frontend/originalMedia/icons/apple-touch-icon.png
      source_url: https://github.com/go-vikunja/vikunja
      docs_url: https://vikunja.io/docs
      # #610 (D1 tier from the first commit): facts promoted from the
      # verified packaging decisions — nothing invented. Alternatives
      # are names only (upstream's own comparison pages).
      caveats:
        - Storage runs on SQLite on the instance volume and batch writes queue one at a time. There is no external database option.
        - The first account registered is not the admin. Promoting an account to admin needs a Vikunja Pro license.
        - Sign-ups stay open on the instance URL. Create your account soon after deploying.
      alternatives:
        - Todoist
        - Trello
      # #611 S7: the curated in-action copy, captured from a running
      # instance (Launch project kanban board + task detail).
      community_url: https://community.vikunja.io/
      in_action_intro: >-
        The Launch project as a kanban board, captured from a running
        instance.
      screenshots:
        - src: /images/catalog/vikunja/kanban.png
          alt: The Launch project kanban board with tasks across three buckets
          caption: A project as a board, columns and all.
        - src: /images/catalog/vikunja/task-detail.png
          alt: A task open with its description and due date
          caption: A task, with its description and due date.
      features:
        - icon: hero-document-text
          title: Views for every kind of work
          body: List, kanban, Gantt and table views on the same project, plus labels and filters.
        - icon: hero-user-group
          title: Share projects with a team
          body: Share a project with household members or a team and work on tasks together.
        - icon: hero-bolt
          title: Reminders and repeating tasks
          body: Tasks take due dates, reminders and repeat patterns so nothing slips.
        - icon: hero-share
          title: CalDAV and app clients
          body: Phone and desktop clients connect over CalDAV and the Vikunja API.
      faq:
        - question: How do I set up Vikunja?
          answer: Open the instance URL and register. Sign-ups stay open, so claim your account early.
        - question: Is the first account the admin?
          answer: No. Vikunja grants the first registrant no extra rights on this packaging.
        - question: Can I connect phone apps?
          answer: Yes. Phone and desktop clients connect over CalDAV and the API.
      versions:
        - version: "2.8.0"          # upstream stable, 2026-11-05
          # The canonical image (upstream's own release pipeline pushes
          # GHCR), pinned by exact tag. ghcr and Docker Hub publish the
          # same build (identical amd64 digest sha256:12c860da…,
          # verified 2026-11-08), and ghcr dodges Docker Hub's anonymous
          # pull limits on shared CI runners — the ActualBudget
          # convention.
          image: ghcr.io/go-vikunja/vikunja:2.8.0
          port: 3456
          # `GET /health` answers 200 "OK", unauthenticated and
          # dependency-free (verified from the running 2.8.0 image;
          # /api/v2/health is the same probe under the v2 prefix).
          healthcheck_path: /health
          # #73's deploy op sets this to the instance's public URL —
          # Vikunja's CORS middleware builds its allowlist from
          # service.publicurl, so the frontend breaks behind the proxy
          # without it (the Forgejo ROOT_URL pattern).
          instance_url_env: VIKUNJA_SERVICE_PUBLICURL
          # #511: the OIDC callback path for sign-in-with-Pocket ID.
          # The path's third segment is the provider KEY `pocketid`,
          # pinned by the discrete VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_*
          # env names below (the key lowercases from the env suffix) —
          # the display-name input cannot change it, unlike Forgejo
          # where the auth-source name IS the path.
          oidc_callback_path: /auth/openid/pocketid
          # Single-volume shape (verified from the running image): the
          # image presets VIKUNJA_DATABASE_PATH=/db/vikunja.db, so the
          # PVC lands at /db and everything else redirects under it —
          # VIKUNJA_FILES_BASEPATH below puts attachments at /db/files
          # (the image's doctor reports it created 0700). The container
          # runs UID 1000 and /db is not in the image, so the mount is
          # load-bearing: without it the app dies at boot with
          # "mkdir /db: permission denied".
          storage_mount_path: /db
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB
          # — exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′). A single
          # Go binary serving API and frontend, verified booting and
          # idling tiny on a fresh cluster. SQLite serializes writes
          # (/api/v1/info reports concurrent_writes false), which is a
          # non-issue at micro and friends-beta scale — the Postgres
          # path arrives with the #612 backing-services layer, whose
          # VIKUNJA_DATABASE_* family the research already mapped.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v2.8.0.
            SQLite on a dedicated volume mounted at /db, attachments
            under it. Sign-ups stay open on the instance URL, so create
            your account right after deploying.
          published_at: "2026-11-05T20:44:21Z"
          # Attachments under the PVC (see storage_mount_path): the
          # image's own default is /app/vikunja/files, outside any
          # mount.
          default_env_vars:
            VIKUNJA_FILES_BASEPATH: /db/files
          # No first-run contract (ADR-0034 leaves the contract
          # optional per app — the Vaultwarden shape): a fresh instance
          # is usable out of the box, registration open. There is no
          # contract to pin because Vikunja 2.x grants the first
          # registrant nothing (verified from the running image: the
          # first account's JWT carries is_admin false, and every
          # admin-grant path — the `user set-admin` CLI and the admin
          # API — is Pro/license-gated), so none of the three known
          # patterns names it. The registration-open posture rides the
          # caveats copy and the seed tests.
          #
          # VIKUNJA_SERVICE_ENABLEREGISTRATION is deliberately NOT
          # shipped in any layer: setting it false at deploy time
          # bricks a fresh instance (no admin exists to undo it — the
          # Vaultwarden SIGNUPS_ALLOWED lockout reasoning). The seed
          # tests pin its absence.
          #
          # The one non-SSO deploy-time input: VIKUNJA_SERVICE_SECRET
          # (upstream defaults to a fresh random secret per boot, so
          # every stop/start signs everyone out; a fixed value set at
          # deploy time preserves sessions — env is a snapshot, so
          # deploy time is the only chance).
          configurable_env_vars:
            VIKUNJA_SERVICE_SECRET:
              label: Session secret
              description: >-
                A random string that keeps everyone signed in across
                restarts. Vikunja makes up a new secret on every boot
                when this is empty, which signs everyone out. Generate
                one with openssl rand -base64 32.
              type: string
              secret: true
            # #511 + #597: the SSO wiring as deploy-time inputs (the
            # Vaultwarden SSO_* reasoning — env is a deploy-time
            # snapshot, so an already-running instance is wired by
            # redeploying with the values). Vikunja 1.0+ reads discrete
            # per-provider env vars (verified from the running image:
            # the provider registers under key `pocketid` and
            # discovery GETs <authurl>/.well-known/openid-configuration,
            # so AUTHURL is the issuer with no trailing slash). The
            # inputs stay inert while the toggle above is false.
            VIKUNJA_AUTH_OPENID_ENABLED:
              label: Enable Pocket ID sign-in
              description: Sign in through the OpenID Connect provider below. Username and password sign-in keeps working.
              type: boolean
              default: false
            VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_NAME:
              label: Provider display name
              description: The label on the sign-in button. It does not change the callback path.
              type: string
              default: "Pocket ID"
            VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_AUTHURL:
              label: OIDC issuer URL
              description: The Pocket ID instance's public URL with no trailing slash. It must match exactly.
              type: string
            VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID:
              label: OIDC client ID
              description: The client ID from the Pocket ID OIDC client.
              type: string
            VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET:
              label: OIDC client secret
              description: The client secret from the Pocket ID OIDC client. Pocket ID shows it once when the client is created.
              type: string
              secret: true
          # #597: the automatic-wiring recipe — presence = the deploy
          # wizard can offer "sign in with your Pocket ID" for this
          # version. The second declared consumer after Vaultwarden.
          # pkce FALSE, unlike Vaultwarden: Vikunja's OpenID client
          # sends no code_challenge anywhere in pkg/modules/auth/openid
          # (verified at v2.8.0), so the minted Pocket ID client must
          # be created with PKCE off. The names must exist in
          # configurable_env_vars and the secret must be secret-typed —
          # enforced at write time, so an upstream env rename fails the
          # seed, not the deploy.
          oidc_wiring:
            kind: env
            issuer_env: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_AUTHURL
            client_id_env: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID
            client_secret_env: VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET
            enabled_env: VIKUNJA_AUTH_OPENID_ENABLED
            pkce: false

- category:
    name: Security
    slug: security
    description: >-
      Password managers and other servers that hold secrets you control.
    audience: >-
      A fit for anyone who would rather hold their own passwords and
      keys.
  apps:
    - name: Vaultwarden
      slug: vaultwarden
      tagline: Bitwarden-compatible password server for your own vault
      description: |
        A Bitwarden-compatible password server written in Rust. Vault
        contents are encrypted and decrypted on your devices, and the
        server only ever holds ciphertext. As the operator of your own
        instance you still see account metadata such as email addresses
        and login times, and any hosted password server can in principle
        serve modified web vault code. That is the same trust class as
        any hosted password manager, with the operator role kept by you.
        The admin panel is disabled in this packaging and sign-ups stay
        open on the instance URL, so create your account soon after
        deploying.
      icon_url: https://raw.githubusercontent.com/dani-garcia/vaultwarden/1.37.5/resources/vaultwarden-icon.svg
      source_url: https://github.com/dani-garcia/vaultwarden
      docs_url: https://github.com/dani-garcia/vaultwarden/wiki
      # #611 S1 retro-fill (plan §8.2): the packaging facts — admin
      # panel off, sign-ups open, SSO wired at deploy time only (env is
      # a deploy-time snapshot, per the SSO_* notes below).
      caveats:
        - The admin panel is disabled in this packaging. There is no admin token to turn on.
        - Sign-ups stay open on the instance URL. Create your account soon after deploying.
        - Pocket ID sign-in is wired at deploy time only. A running instance needs a redeploy to add it.
      alternatives:
        - Bitwarden
        - 1Password
      # #611 S7: the curated in-action copy, captured from a running
      # instance (vault list + item detail).
      community_url: https://github.com/dani-garcia/vaultwarden/discussions
      in_action_intro: >-
        The web vault with two example logins, captured from a running
        instance.
      screenshots:
        - src: /images/catalog/vaultwarden/vault-items.png
          alt: The Bitwarden web vault listing two example logins
          caption: The vault, with your logins in one list.
        - src: /images/catalog/vaultwarden/item-detail.png
          alt: A login item detail with the username, masked password and website
          caption: An item, with its fields and history.
      features:
        - icon: hero-key
          title: Works with Bitwarden apps
          body: Point the official Bitwarden apps at your instance and they just sync.
        - icon: hero-shield-check
          title: End-to-end encrypted
          body: Vault contents are encrypted and decrypted on your devices. The server holds ciphertext only.
        - icon: hero-user-group
          title: Share through collections
          body: Collections and organizations let a family or team share selected logins.
        - icon: hero-finger-print
          title: Passkeys and two-factor sign-in
          body: Attach two-factor login and WebAuthn passkeys to accounts for extra safety.
      faq:
        - question: How do I set up Vaultwarden?
          answer: Open the web vault and create your account, then point your Bitwarden apps at the instance URL.
        - question: Can anyone register?
          answer: Sign-ups stay open on the instance URL. Create your account soon after deploying.
        - question: Is there an admin panel?
          answer: No. The admin panel is disabled in this packaging and there is no admin token to turn on.
      versions:
        - version: "1.37.5"          # upstream stable, 2026-11-01
          # The canonical upstream image: Docker Hub is the release
          # workflow's primary target (ghcr.io and quay.io carry the
          # same build). Tag is the exact upstream release version.
          image: docker.io/vaultwarden/server:1.37.5
          port: 80
          # Vaultwarden's own health endpoint — the upstream image's
          # HEALTHCHECK probes the same path. A plain unauthenticated 200.
          healthcheck_path: /alive
          # The deployer injects the instance's public URL into this env
          # var (Forgejo's ROOT_URL pattern): Vaultwarden derives absolute
          # URLs (web vault, attachments) from DOMAIN.
          instance_url_env: DOMAIN
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # the URL registered on the Pocket ID client is the instance
          # URL plus this path (upstream's SSO wiki pins it).
          oidc_callback_path: /identity/connect/oidc-signin
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB —
          # exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′). Honest in
          # both directions (#492): a single Rust binary
          # with SQLite, no server-side vault crypto (clients do the
          # end-to-end work), and upstream runs it on far less than this.
          # 512 MB keeps attachment sync comfortable, and logins are
          # bursty (one server-side hash per sign-in), so 0.25 CPU covers
          # personal use. Attachment-heavy vaults can move up a rung in
          # the stepper.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v1.37.5.
            SQLite on a dedicated volume at /data. The admin panel is
            disabled (no admin token is configured) and sign-ups stay
            open on the instance URL, so create your account right after
            deploying. Point your Bitwarden apps at the instance URL.
          published_at: "2026-11-01T22:16:50Z"
          # No first-run contract (ADR-0034 leaves the contract optional
          # per app): first open shows the web vault with account
          # creation open, usable out of the box. The admin-panel-off
          # posture (#492) is one of ABSENCE — no ADMIN_TOKEN exists in
          # any packaging layer (defaults, deploy-time settings, a
          # first-run env), so nothing re-applies at boot that could
          # weaken it. The catalog data + seed tests pin the absence.
          #
          # The one deploy-time setting is the sign-ups domain whitelist:
          # with the admin panel off and no post-deploy env editing,
          # deploy time is the only chance to scope registration. Upstream's
          # SIGNUPS_ALLOWED is deliberately NOT shipped — setting it false
          # at deploy time locks the owner out of a fresh instance (no
          # admin panel to undo it).
          configurable_env_vars:
            SIGNUPS_DOMAINS_WHITELIST:
              label: Restrict sign-ups to an email domain
              description: Only email addresses at this domain can register. Leave empty to let anyone with the URL register.
              type: string
            # #511: the SSO wiring as deploy-time inputs — env is a
            # deploy-time snapshot (no post-deploy editing), so an
            # already-running instance is wired by redeploying with the
            # values. SSO_PKCE and SSO_SCOPES keep upstream defaults,
            # which match a Pocket ID client created with PKCE on.
            # SSO_AUTHORITY must equal the Pocket ID instance URL
            # exactly (it is the issuer). The master password keeps
            # unlocking the vault regardless: SSO gates the front door
            # only.
            SSO_ENABLED:
              label: Enable Pocket ID sign-in
              description: Sign in through the OpenID Connect provider below. The master password keeps unlocking the vault either way.
              type: boolean
              default: false
            SSO_AUTHORITY:
              label: OIDC issuer URL
              description: The Pocket ID instance's public URL with no trailing slash. It must match exactly.
              type: string
            SSO_CLIENT_ID:
              label: OIDC client ID
              description: The client ID from the Pocket ID OIDC client.
              type: string
            SSO_CLIENT_SECRET:
              label: OIDC client secret
              description: The client secret from the Pocket ID OIDC client. Pocket ID shows it once when the client is created.
              type: string
              secret: true
          # #597: the automatic-wiring recipe — presence = the deploy
          # wizard can offer "sign in with your Pocket ID" for this
          # version. kind env = the platform injects everything at
          # deploy: it mints the Pocket ID client and writes the four
          # SSO_* inputs above server-side (the manual values stay the
          # fallback). pkce matches a Pocket ID client created with
          # PKCE on. The names must exist in configurable_env_vars and
          # the secret must be secret-typed — enforced at write time,
          # so an upstream env rename fails the seed, not the deploy.
          # Per-version data: more apps join by declaring a recipe
          # (D4); Pocket ID itself and the in-app-configured consumers
          # (Forgejo, Kavita, Memos) carry none in v1.
          oidc_wiring:
            kind: env
            issuer_env: SSO_AUTHORITY
            client_id_env: SSO_CLIENT_ID
            client_secret_env: SSO_CLIENT_SECRET
            enabled_env: SSO_ENABLED
            pkce: true

- category:
    name: Identity
    slug: identity
    description: >-
      Sign-in and identity apps that secure access to your other apps.
    audience: >-
      A fit for households and teams that want one sign-in they control.
  apps:
    - name: Pocket ID
      slug: pocket-id
      tagline: Passkey-first OpenID Connect provider
      description: |
        A featherweight OpenID Connect (OIDC) provider built around
        passkeys. Sign in to your other apps with passkeys instead of
        passwords, with OIDC client management, users and groups, and a
        sign-in audit log. The embedded SQLite database and uploads live
        on a dedicated volume, and all configuration happens in the web
        UI after a one-time encryption key at deploy. Other apps can use
        this instance as their sign-in provider, which makes it
        load-bearing. Turn on the always-on flag after deploy, because
        a sleeping Pocket ID answers your apps' sign-ins with errors
        while it wakes. Keep the instance public so your apps can reach
        it, and save the encryption key, because restoring a backup
        needs it.
      icon_url: https://raw.githubusercontent.com/pocket-id/pocket-id/main/frontend/static/img/static-logo.svg
      source_url: https://github.com/pocket-id/pocket-id
      docs_url: https://pocket-id.org/docs/introduction
      # #611 S1 retro-fill (plan §8.2): the availability, custody, and
      # load-bearing facts the description itself carries.
      caveats:
        - This app wants the always-on flag. A sleeping Pocket ID fails your apps' sign-ins while it wakes.
        - Save the encryption key you set at deploy. Restoring a backup of this instance needs it.
        - Other apps use it for sign-in, so it is load-bearing. Treat restarts accordingly.
      alternatives:
        - Keycloak
        - Auth0
      # #611 S7: the curated in-action copy, captured from a running
      # instance (users list + OIDC client detail).
      community_url: https://github.com/pocket-id/pocket-id/discussions
      in_action_intro: >-
        The admin panel with two accounts and an OIDC client, captured
        from a running instance.
      screenshots:
        - src: /images/catalog/pocket-id/users.png
          alt: The Pocket ID user list showing an admin and a regular user
          caption: Everyone who can sign in, in one list.
        - src: /images/catalog/pocket-id/client-detail.png
          alt: The Pocket ID client page with the client ID and callback URL
          caption: A client, with the callback URL it trusts.
      features:
        - icon: hero-finger-print
          title: Passkey-first sign-in
          body: Users authenticate with passkeys instead of passwords.
        - icon: hero-key
          title: OIDC for your other apps
          body: OpenID Connect clients let your self-hosted apps use Pocket ID for sign-in.
        - icon: hero-user-group
          title: Users and groups
          body: Manage users and groups in one admin panel with a sign-in audit log.
        - icon: hero-shield-check
          title: Lightweight and load-bearing
          body: A single small binary that stays fast, because your other apps depend on it.
      faq:
        - question: How do I set up Pocket ID?
          answer: Open the instance URL and create your account on the setup page, then add a passkey.
        - question: Do users need a passkey?
          answer: Passkeys are the primary sign-in method.
        - question: What connects over OIDC?
          answer: Any app that speaks OpenID Connect. Register it as a client and point its callback URL here.
      versions:
        - version: "2.19.2"          # upstream stable, 2026-11-02
          # The canonical image, built and pushed by Pocket ID's own
          # release workflow; `pocketid/pocket-id` on Docker Hub is the
          # same build, not a distinct one. Upstream tags releases with
          # a `v` prefix, which the image keeps.
          image: ghcr.io/pocket-id/pocket-id:v2.19.2
          port: 1411
          healthcheck_path: /healthz
          # #73's deploy op sets this to the instance's public URL:
          # passkeys are bound to the domain, and every OIDC URL Pocket
          # ID hands out is built from APP_URL (the app trims the
          # trailing slash itself).
          instance_url_env: APP_URL
          # Pocket ID keeps everything in one place: the embedded SQLite
          # DB (`DB_CONNECTION_STRING` defaults to a path relative to the
          # container's working dir /app), uploads, and the GeoLite cache
          # all resolve under /app/data — exactly the directory the
          # upstream compose file mounts a volume at. The image's own
          # entrypoint chowns it to PUID/PGID 1000 before dropping
          # privileges, so the PVC lands correctly owned.
          storage_mount_path: /app/data
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB —
          # exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′).
          # The honest floor: Pocket ID is a single static Go binary with
          # an embedded SQLite DB, idling at tens of MB. Availability is
          # not a sizing question for the identity instance (#511): it
          # wants the instance's always-on flag, not a bigger size.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v2.19.2.
            SQLite on a dedicated volume mounted at /app/data. The admin
            account is created on first open.
          published_at: "2026-11-02T20:18:20Z"
          # Operator-owned config: TRUST_PROXY — upstream's stated
          # condition for `true` is that Pocket ID "can't be reached
          # without going through your proxy", which is every FluxVale
          # instance (k8s Service behind Traefik). Without it the audit
          # log and rate limits would key on the proxy address instead
          # of the client's.
          default_env_vars:
            TRUST_PROXY: "true"
          # First-run contract (ADR-0034): /setup answers only until the
          # first account exists and that account is the admin —
          # registration is open on first boot in exactly the Kavita
          # sense. No env lever touches it: user sign-ups default to
          # disabled (they live in the admin UI), so there is nothing to
          # pin and nothing to lock.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            guidance: >-
              Open the instance URL and create your account on the setup
              page, then add a passkey. That first account is the admin,
              and the setup page disappears once it exists, so claim the
              instance promptly. Sign-ups stay closed afterwards unless
              you turn them on in the admin settings.
          # Pocket ID's one required variable (its only hard boot gate):
          # ENCRYPTION_KEY encrypts the token-signing keys at rest, and
          # the app refuses to start with fewer than 16 bytes. There is
          # no upstream default and the platform mints no per-instance
          # secrets, so the owner picks it at deploy time (upstream's
          # recipe is `openssl rand -base64 32`). It ships as the
          # version's single deploy-time input, secret-shaped, and lands
          # in the instance's K8s Secret.
          configurable_env_vars:
            ENCRYPTION_KEY:
              label: Encryption key
              description: >-
                Encrypts Pocket ID's stored secrets. Generate one with
                openssl rand -base64 32 (at least 16 characters) and
                save it somewhere safe, because restoring a backup of
                this instance needs it.
              type: string
              required: true
              secret: true

- category:
    name: Finance
    slug: finance
    description: >-
      Budgeting and money apps for the household.
    audience: >-
      A fit for households that want their budget data under their own
      roof.
  apps:
    - name: ActualBudget
      slug: actualbudget
      tagline: Envelope budgeting shared by the whole household
      description: |
        Local-first envelope budgeting for the household. Budgets sync
        across devices and family members sign in with the shared
        server password you set on first open. Transactions, reports,
        and statement imports run in the browser, and budget files
        live on a dedicated volume. Bank sync works with your own
        SimpleFIN token.
      # The repo's logo.svg is the white-glyph-on-transparent variant
      # (both paths fill="white") — invisible on the light icon tile.
      # The apple-touch icon is the same mark, self-contained: white
      # glyph on the solid purple field (#5D3DBA).
      icon_url: https://raw.githubusercontent.com/actualbudget/actual/v26.11.0/packages/desktop-client/public/apple-touch-icon.png
      source_url: https://github.com/actualbudget/actual
      docs_url: https://actualbudget.org/docs/
      # #611 S1 retro-fill (plan §8.2): the shared-password and bank
      # sync facts from the description, the release notes, and the
      # first-run contract below.
      caveats:
        - Everyone signs in with one shared server password. Set it on first open.
        - Bank sync needs a SimpleFIN token you provide in the app's own settings.
      alternatives:
        - YNAB
        - Firefly III
      # #611 S7: the curated in-action copy, captured from a running
      # instance (November budget + the Everyday register).
      community_url: https://actualbudget.org/contact
      in_action_intro: >-
        A month budgeted and spent in Actual, captured from a running
        instance.
      screenshots:
        - src: /images/catalog/actualbudget/budget-overview.png
          alt: The Actual budget page for November with budgeted, spent and balance columns
          caption: A month, budgeted and spent in one view.
        - src: /images/catalog/actualbudget/account-register.png
          alt: The Everyday account register with six categorized transactions
          caption: Every account keeps its own register.
      features:
        - icon: hero-calculator
          title: Envelope budgeting
          body: Assign every dollar a job, then watch spent and balance update as you spend.
        - icon: hero-share
          title: Shared by the household
          body: Family members sign in with the server password and budgets sync across devices.
        - icon: hero-chart-bar
          title: Reports on your spending
          body: Net worth, spending and cash flow reports come built in.
        - icon: hero-document-text
          title: Import from your bank
          body: Import QIF, OFX and QFX files into any account when statements arrive.
      faq:
        - question: How do I set up ActualBudget?
          answer: Open the instance URL and set the server password. That first open claims the instance.
        - question: How do we share one budget?
          answer: Share the server password with people you trust. Everyone signs in with it.
        - question: Does it connect to my bank?
          answer: Bank sync works with a SimpleFIN token you provide in the app's own settings.
      versions:
        - version: "26.11.0"          # upstream stable, 2026-11-02
          # The canonical image: ghcr and Docker Hub publish the same
          # build (identical amd64 manifest digest, sha256:c56adb68…),
          # and ghcr dodges Docker Hub's anonymous pull limits on
          # shared CI runners. This is the project's own supported
          # container (actualbudget.org/docs/install/docker), not a
          # community repackage.
          image: ghcr.io/actualbudget/actual-server:26.11.0
          port: 5006
          # Sync-server router (v26.11.0 tag): GET /health answers 200
          # {"status":"UP"} with no dependency checks.
          healthcheck_path: /health
          # The image's data dir defaults to /data when it exists, and
          # the server splits state under it: account.sqlite (hashed
          # server password + budget file list) in /data/server-files,
          # budget blobs in /data/user-files. The default volume root
          # is the right mount, no per-app override needed. The image
          # runs as UID 1001 (upstream USER_UID) and only chowns /data
          # at build time, so the volume must be writable by that UID —
          # local-path provisioning is; a root-owned CSI volume would
          # need an fsGroup the deployer does not set today.
          storage_mount_path: /data
          # #73's deploy op fills this with the instance's public URL
          # (the Forgejo ROOT_URL pattern): upstream's OpenID setup
          # needs the server hostname so the provider redirects back
          # here. Inert until OpenID is configured.
          instance_url_env: ACTUAL_OPENID_SERVER_HOSTNAME
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # upstream pins <server hostname>/openid/callback as the
          # redirect URI to register on the provider's client.
          oidc_callback_path: /openid/callback
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′). Idle RSS
          # measured ~110 MB on 26.11.0, so `micro` boots.
          # The classes differ in CPU only (both are 512 MB): 0.25 CPU
          # throttles sync and report work on real
          # budgets, and attachments grow past 5 GB. The stepper's
          # first impression should not undersell a financial records
          # app; `small` matches the shipped unit.
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v26.11.0.
            SQLite on a dedicated volume mounted at /data. The first
            open sets the server password, which family members share
            to sign in.
          published_at: "2026-11-02T01:54:02Z"
          # #511 + #521: the OpenID wiring rides deploy-time inputs (the
          # Vaultwarden SSO reasoning — env is a deploy-time snapshot),
          # MINUS the two bootstrap triggers. The first-run contract is
          # the sole owner of ACTUAL_OPENID_DISCOVERY_URL and
          # ACTUAL_OPENID_AUTHORIZATION_ENDPOINT (#521 — the seed
          # refuses any overlap), so the discovery URL is not a deploy
          # input and the packaging wires no OpenID claim path. The
          # remaining knobs are the non-triggering cast-through inputs.
          configurable_env_vars:
            ACTUAL_OPENID_CLIENT_ID:
              label: OpenID client ID
              description: The client ID from the Pocket ID OIDC client.
              type: string
            ACTUAL_OPENID_CLIENT_SECRET:
              label: OpenID client secret
              description: The client secret from the Pocket ID OIDC client. Pocket ID shows it once when the client is created.
              type: string
              secret: true
            ACTUAL_USER_CREATION_MODE:
              label: Create users on first sign-in
              description: Set to login to create an account the first time someone signs in with OpenID. Leave empty to pre-create accounts in Actual's Users screen instead.
              type: string
          # First-run contract (#492, ADR-0034 Am. 1): a fresh sync
          # server ships unclaimed (GET /account/needs-bootstrap →
          # bootstrapped:false), and the web UI's first open IS the
          # claim — set the server password (POST /account/bootstrap,
          # one-time, refuses after). There is no registration and no
          # admin seat: everyone signs in with that one shared
          # password, so `first_registered_user_admin` misnames it.
          # The `first_open_sets_password` pattern documents the shape.
          # `forbidden_env` closes the user-env injection path (#482
          # lets instances carry free-form env vars through to the
          # container): ACTUAL_OPENID_DISCOVERY_URL and
          # ACTUAL_OPENID_AUTHORIZATION_ENDPOINT are the two upstream
          # keys whose presence triggers the boot-time OIDC bootstrap
          # (sync-server run() calls bootstrap({openId}, true) when
          # either is set). With user-injected ACTUAL_OPENID_CLIENT_ID
          # and ACTUAL_OPENID_SERVER_HOSTNAME alongside, that bootstrap
          # succeeds and the server is claimed before the owner's first
          # open, so locking the necessary triggers closes the
          # env-injected claim path; the remaining OIDC knobs alone
          # cannot trigger it. Everything else upstream ships is
          # operator-side config that the packaging does not expose.
          # Verified against ghcr.io/actualbudget/actual-server:26.11.0:
          # the bootstrapped flag and the password survive a pod
          # recreation on the same volume.
          first_run:
            pattern: first_open_sets_password
            env: {}
            forbidden_env:
              - ACTUAL_OPENID_DISCOVERY_URL
              - ACTUAL_OPENID_AUTHORIZATION_ENDPOINT
            guidance: >-
              Open the instance URL and set the server password. That
              first open claims the instance, so do it right after
              deploying, and the password you choose is what everyone
              signs in with. Share it only with people you trust with
              your budget. Change the password from Actual's user menu
              to cut off access later.

- category:
    name: Analytics
    slug: analytics
    description: >-
      Web analytics and visitor insight apps for the sites you run.
    # #611 D5, the wave-5 category's line (same "who it suits" voice
    # as the siblings above).
    audience: >-
      A fit for anyone who wants honest visitor numbers on the sites
      they run, without cookies or a third party holding the data.
  apps:
    - name: Umami
      slug: umami
      tagline: Cookieless web analytics you host yourself
      description: |
        Web analytics you host yourself. See pageviews, visitors, and
        events for each site, with funnels, journeys, retention,
        revenue, session replay, and heatmaps built in. Tracking sets
        no cookies and stores nothing on your visitors' devices. Umami
        is MIT licensed. All data lives in PostgreSQL. The bundled row
        keeps the database inside the instance, on the instance
        volume. Sign in soon after deploying,
        because a fresh install answers to a default admin account.
      # The repo's apple-touch-icon is the self-contained mark (the
      # ActualBudget lesson): a black glyph on a solid white field, so
      # it reads on the icon tile in both themes. The repo's other
      # assets (favicon PNGs, safari-pinned-tab.svg) are black-on-
      # transparent and vanish on the dark tile.
      icon_url: https://raw.githubusercontent.com/umami-software/umami/v3.4.1/public/apple-touch-icon.png
      source_url: https://github.com/umami-software/umami
      docs_url: https://umami.is/docs
      # #611's recommended tier for the wave-5 entry (#576), same rule
      # as the S1 retro-fill: facts promoted from the description and
      # the packaging decisions below — nothing invented. Alternatives
      # are names only. #612 S4: the copy covers BOTH version rows —
      # the bundled row ships the database, the pinned 3.4.1 row
      # connects one you bring.
      caveats:
        - The bundled row keeps all data in its bundled PostgreSQL database on the instance volume. The pinned v3.4.1 row connects an external database you bring.
        - A fresh install signs in with a default admin account. Change its password right after deploying.
        - Two-factor sign-in stays off unless its encryption key is set at deploy time.
      alternatives:
        - Plausible
        - Matomo
      # #611 S7: the curated in-action copy, captured from a running
      # instance (demo.example website dashboard + realtime feed).
      community_url: https://github.com/umami-software/umami/discussions
      in_action_intro: >-
        The Umami dashboard with demo traffic on one website, captured
        from a running instance.
      screenshots:
        - src: /images/catalog/umami/website-dashboard.png
          alt: The Umami website dashboard with a traffic chart and visitor cards
          caption: Traffic, sessions and top pages for one site.
        - src: /images/catalog/umami/realtime.png
          alt: The Umami realtime activity feed listing recent pageviews
          caption: Who is on the site right now.
      features:
        - icon: hero-chart-bar
          title: Pageviews without cookies
          body: Collect pageviews and events without cookie banners or third-party trackers.
        - icon: hero-magnifying-glass
          title: Filter any view
          body: Break traffic down by path, referrer, browser, country and device.
        - icon: hero-device-phone-mobile
          title: Realtime visitor feed
          body: The realtime page lists who is on the site right now.
        - icon: hero-share
          title: Share stats publicly
          body: Optional shared links let a client or team see a site's numbers.
      faq:
        - question: How do I set up Umami?
          answer: Open the instance URL and sign in with the default admin account, then change the password.
        - question: How does tracking work?
          answer: Add the tracking snippet to your site. Pageviews stream in without cookies.
        - question: Where is my data stored?
          answer: On the bundled version, in its own PostgreSQL on the instance volume. On the plain 3.4.1 version, in the PostgreSQL database you supply through DATABASE_URL.
      # The bundled row covers both version rows' public copy.
      versions:
        - version: "3.4.1-bundled"    # packaging variant, 2026-11-09
          # The OQ #3 takeover row (#612 S4): same upstream image as
          # 3.4.1, plus the bundled PostgreSQL. A NEW row on purpose —
          # instances pin their version at create, so the pinned BYO
          # row (below) is never retconned; the semver sort (#700)
          # places the suffixed row below the bare 3.4.1 (a pre-release
          # sorts below its release), so the wizard's picker lists the
          # plain release first and picks nothing for the user.
          # Upstream tags carry no v prefix (verified
          # against the GHCR v2 API at #576); the suffix is ours, the
          # only way the per-app unique-version identity allows a
          # second row of the same release.
          image: ghcr.io/umami-software/umami:3.4.1
          port: 3000
          # The image's own HEALTHCHECK probes the same path
          # (docker-compose v3.4.1): an unauthenticated 200 {"ok":true}
          # — re-verified from the running image on this tag.
          healthcheck_path: /api/heartbeat
          # Umami is stateless itself; the bundled PostgreSQL 18 is
          # its whole storage story, so the DB's data dir under
          # backing/ of the instance volume is what the 10 GB buys
          # (events, sessions, accounts — years of a small site).
          default_storage_gb: 10
          # Honest sizing (D1/D4/D5), probed from the running image on
          # the local cluster: the app idles at ~123 Mi (Next
          # standalone, migrations done), PG 18 at ~29 Mi. The bundle
          # carves 0.10 CPU / 256 MB (the registry's PG share), so
          # `medium` leaves the app 0.40 CPU / 768 MB requested — 6x
          # its measured idle, with the house-2x limits above that.
          # `small` would leave 256 MB — 2x idle with no ingest
          # headroom; the plan's bigger-defaults rule (§4.5) says no.
          default_cpu_cores: "0.5"
          default_memory_mb: 1024
          # The compute class (#125, #558): `medium` is 0.5 CPU /
          # 1024 MB — exactly this version's compute ($3.69/mo) plus
          # 10 GB storage at $0.40/mo: $4.09/mo at the recommendation.
          # The S3 floors keep every allocation at or above it.
          recommended_size: medium
          release_notes: |
            The bundled packaging of upstream v3.4.1: PostgreSQL 18
            runs inside the instance and shares its resources, all
            data on the instance volume. Existing instances keep the
            external-database packaging of the same release. Their
            pinned row is unchanged.
          published_at: "2026-11-09T00:00:00Z"
          # DATABASE_URL flips platform-owned on THIS row (the
          # takeover): the spec keeps secret:true (the URL embeds the
          # generated password) and drops required — the platform
          # composes it at deploy from the get-or-create
          # backing-services Secret, the wizard never renders the
          # input, and a user value naming it is rejected at create
          # (#612 D6). APP_SECRET stays the owner's required secret
          # (the platform mints no app secrets); the optional 2FA key
          # rides along unchanged.
          configurable_env_vars:
            DATABASE_URL:
              label: PostgreSQL connection string
              description: Provided by the bundled PostgreSQL. There is nothing to enter.
              type: string
              required: false
              secret: true
            APP_SECRET:
              label: App secret
              description: >-
                A random string that secures the tokens Umami issues at
                sign-in. Generate one with openssl rand -base64 32 and
                keep the same value on every restart.
              type: string
              required: true
              secret: true
            TWO_FACTOR_ENCRYPTION_KEY:
              label: Two-factor encryption key
              description: >-
                Only needed if you plan to turn on two-factor sign-in.
                Generate one with openssl rand -hex 32. Umami cannot
                store two-factor secrets without it.
              type: string
              secret: true
          # The bundle declaration (S1's contract): one service, the
          # registry's postgres major. No Redis — Umami uses none
          # (upstream's own compose ships app + db only).
          backing_services:
            - kind: postgres
              version: "18"
              url_env: DATABASE_URL
          # Same first-run contract as the BYO row: upstream's first
          # migration seeds the default admin, and the locks keep user
          # env from skipping it — the bundled DB changes where the
          # migration runs, not what it does.
          first_run:
            pattern: default_admin_credentials
            env: {}
            forbidden_env:
              - SKIP_DB_CHECK
              - SKIP_DB_MIGRATION
            guidance: >-
              Open the instance URL and sign in with username admin and
              password umami. Change that password right away, because
              every Umami install starts with the same one. Then add
              your first website in Umami to get its tracking snippet.
        - version: "3.4.1"          # upstream stable, 2026-10-23
          # The BYO row — pinned by every instance created before the
          # bundled row existed (#612 S4's never-retconned half). Kept
          # byte-for-byte: existing instances re-render from their
          # snapshot of it, and a new instance may still choose it.
          # The canonical image (upstream's own release pipeline pushes
          # GHCR), pinned by exact tag. Unlike Pocket ID, Umami's image
          # tags carry NO v prefix — v3.4.1 does not exist in the
          # registry (verified against the GHCR v2 API; 3.4.1 resolves
          # to the multi-arch index, digest sha256:e69d1a79…, whose
          # amd64 manifest is sha256:f2c645cc… — pin the INDEX if this
          # ever moves to a digest pin, never the per-arch manifest).
          image: ghcr.io/umami-software/umami:3.4.1
          port: 3000
          # The image's own HEALTHCHECK probes the same path
          # (docker-compose v3.4.1): an unauthenticated 200 {"ok":true}.
          healthcheck_path: /api/heartbeat
          # Stateless by design: Umami keeps every row (websites,
          # events, sessions, accounts) in the PostgreSQL database named
          # by DATABASE_URL, and the container writes nothing it needs
          # back. default_storage_gb 0 means the deployer never mounts a
          # PVC (#558's honest per-app storage default — the storage
          # axis is simply empty for this app), so the loader's
          # storage_mount_path default never applies.
          default_storage_gb: 0
          # The compute class (#125, #558): `micro` is 0.25 CPU /
          # 512 MB — exactly this version's compute ($2.59/mo) plus
          # $0/GB of storage. A single Node process (Next standalone
          # server) that idles around 200 MB (#576's stated figure);
          # the boot-time prisma migration runs in the same budget as a
          # separate process (start-docker.sh execs the server only
          # after check-db exits), so the floor holds.
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v3.4.1.
            One stateless Node server, all data in the PostgreSQL
            database connected at deploy time. The first open signs in
            with the default admin account and changes its password.
          published_at: "2026-11-08T01:20:00Z"
          # DATABASE_URL is the app's whole storage story on this row,
          # and the platform provisions no per-app databases (OQ #14:
          # where customer DBs would live is deliberately unsettled —
          # ADR-0009 names only first-party tenants). So the connection
          # string ships as the owner's one required input, the Pocket ID
          # ENCRYPTION_KEY precedent (the platform mints no per-instance
          # secrets or services). Egress from instance namespaces is
          # open, so the database may live anywhere the instance can
          # reach. The bundled row above now owns this key for NEW
          # instances (#612 S4 — the OQ #3 trigger resolved).
          #
          # APP_SECRET (still the v3 name — checked at tag v3.4.1, not
          # renamed) salts the app's signed tokens; upstream falls back
          # to hashing DATABASE_URL when unset, which is why an explicit
          # value ships as a required input instead.
          #
          # TWO_FACTOR_ENCRYPTION_KEY is optional: enabling two-factor
          # sign-in inside the app 503s without it (the 2FA setup route
          # refuses while "secrets cannot be stored without an
          # encryption key"), and env is a deploy-time snapshot, so an
          # owner who wants 2FA must set it here.
          configurable_env_vars:
            DATABASE_URL:
              label: PostgreSQL connection string
              description: >-
                Umami keeps everything in PostgreSQL. Paste a connection
                string this instance can reach over the network, like
                postgresql://user:password@host:5432/dbname. The
                database is yours to run, back up, and restore.
              type: string
              required: true
              secret: true
            APP_SECRET:
              label: App secret
              description: >-
                A random string that secures the tokens Umami issues at
                sign-in. Generate one with openssl rand -base64 32 and
                keep the same value on every restart.
              type: string
              required: true
              secret: true
            TWO_FACTOR_ENCRYPTION_KEY:
              label: Two-factor encryption key
              description: >-
                Only needed if you plan to turn on two-factor sign-in.
                Generate one with openssl rand -hex 32. Umami cannot
                store two-factor secrets without it.
              type: string
              secret: true
          # First-run contract (ADR-0034 Am. 2): upstream's own first
          # migration inserts the default admin (username admin,
          # password umami — the README pins both), so the claim is
          # sign-in-then-change-password. `env` is empty (nothing to
          # pin). `forbidden_env` locks the two boot flags whose
          # presence would skip that migration and leave a fresh
          # install with no admin at all: SKIP_DB_CHECK exits
          # check-db.js before migrations run, SKIP_DB_MIGRATION skips
          # the migrate step itself (both read in the image's
          # start-docker.sh path; the free-form user-env path #482 can
          # carry either).
          first_run:
            pattern: default_admin_credentials
            env: {}
            forbidden_env:
              - SKIP_DB_CHECK
              - SKIP_DB_MIGRATION
            guidance: >-
              Open the instance URL and sign in with username admin and
              password umami. Change that password right away, because
              every Umami install starts with the same one. Then add
              your first website in Umami to get its tracking snippet.

- category:
    name: Knowledge
    slug: knowledge
    description: >-
      Wiki and knowledge base apps for teams that document together.
    # #611 D5, the wave-6 category's line (the same "who it suits"
    # voice as the siblings above).
    audience: >-
      A fit for teams that want their shared knowledge in one place
      they control.
  apps:
    - name: Docmost
      slug: docmost
      tagline: Team wiki and docs you host yourself
      description: |
        A wiki and knowledge base for your team, with a real-time
        collaborative editor. Pages organize into spaces, search covers
        the whole workspace, and comments, mentions, and history keep
        the discussion next to the text. Docmost's core is AGPL
        licensed and free to host. Pages and accounts live in a
        PostgreSQL database you connect at deploy time, and real-time
        editing needs a Redis server you bring as well. Both stay
        yours to run and back up. Uploaded files live on the instance
        volume. Open the instance right after deploying to create the
        first account, because it becomes the workspace admin.
      # The PWA app-icon is the self-contained mark (the ActualBudget
      # lesson): a white glyph on a fully opaque black field, so it
      # reads on the icon tile in both themes. Pinned to the tag.
      icon_url: https://raw.githubusercontent.com/docmost/docmost/v0.97.0/apps/client/public/icons/app-icon-512x512.png
      source_url: https://github.com/docmost/docmost
      docs_url: https://docmost.com/docs
      # #611's recommended tier (#609), same rule as Umami: facts
      # promoted from the description and the packaging decisions
      # below, nothing invented. The paid-tier disclosure is Terence's
      # researched call: PikaPods hosts the AGPL core commercially and
      # states the paid add-ons plainly, and so does this.
      caveats:
        - Docmost needs two services you bring yourself, a PostgreSQL database and a Redis server. Both are entered at deploy time and stay yours to run and back up.
        - Single sign-on over OIDC and SAML, Bases databases, and AI features need a paid Docmost Business license from upstream. The AGPL edition hosted here does not include them.
        - This entry sends no email. Invite people with a copyable link from the members settings instead.
      alternatives:
        - Notion
        - Outline
      # #611 S7: the curated in-action copy (Getting Started page +
      # Handbook space tree).
      community_url: https://github.com/docmost/docmost/discussions
      in_action_intro: >-
        A workspace wiki with a Handbook space, captured from a running
        instance.
      screenshots:
        - src: /images/catalog/docmost/page.png
          alt: The Getting started page open in the Docmost editor
          caption: A page, written and edited in place.
        - src: /images/catalog/docmost/space-tree.png
          alt: The Docmost sidebar showing the Handbook page tree
          caption: The space tree, one page under another.
      features:
        - icon: hero-chat-bubble-left-right
          title: Real-time collaborative editor
          body: The editor updates live, so comments, mentions and history stay next to the text.
        - icon: hero-book-open
          title: Spaces organize the wiki
          body: Pages organize into spaces, and pages nest under pages in the tree.
        - icon: hero-magnifying-glass
          title: Search the whole workspace
          body: Search covers every space, so the team finds pages fast.
        - icon: hero-document-text
          title: Export pages for backups
          body: Export pages and spaces to markdown and html when you need copies.
      faq:
        - question: How do I set up Docmost?
          answer: Open the instance URL and create your account on the setup page. It becomes the workspace admin.
        - question: How do I invite the team?
          answer: Invite people with a copyable link from the members settings.
        - question: Is the AI included?
          answer: No. AI features need a paid Docmost Business license from upstream.
      versions:
        - version: "0.97.0"          # upstream stable, 2026-10-25
          # The canonical image is Docker Hub only: ghcr.io/docmost
          # has no such repository (NAME_UNKNOWN from the GHCR v2
          # API, checked 2026-11-09). Pinned by tag AND digest — the
          # digest is the multi-arch INDEX docker.io reports for the
          # 0.97.0 tag (never a per-arch manifest, the Umami lesson)
          # and it matched the imageID a live pod resolved and pulled
          # in the verification run. Tag plus digest keeps the ref
          # readable and immutable; a re-pushed tag cannot shift it.
          image: docker.io/docmost/docmost:0.97.0@sha256:40c454d74ffdd9ecb15833e4d96f3a630d59aad862a1869381ae6ee086454419
          port: 3000
          # The dependency-aware endpoint (NestJS terminus at
          # /api/health): 200 only when the app answers AND both the
          # PostgreSQL and Redis connections ping up — verified live,
          # including the honest failure side (Redis scaled to zero
          # makes the probe hang, so readiness fails rather than
          # lying green). /api/health/live exists too but is
          # dependency-blind; Running must mean usable, so the
          # readiness path is the deep one.
          healthcheck_path: /api/health
          # Upstream's own volume (Dockerfile VOLUME + the compose
          # mount): uploaded files land here with the local storage
          # driver, the image default. The image runs as UID 1000
          # (node) and pre-creates the directory — which the PVC
          # mount shadows, so writability rides the pod-level fsGroup
          # the deployer grants on every volume-mounting pod (#609's
          # fix; the image's own mkdir never sees the mounted path).
          storage_mount_path: /app/data/storage
          # Docmost derives its own links and websocket origin from
          # APP_URL (optional upstream, defaults to localhost:3000 —
          # wrong for an instance URL), so the deployer injects the
          # instance URL into it, the Pocket ID APP_URL shape.
          instance_url_env: APP_URL
          # The BYO-interim shape (#609's interim pattern, Umami
          # #587's precedent): upstream's own compose ships app +
          # postgres:18 + redis:8 as one unit, and the app's boot
          # validation exits without DATABASE_URL (postgres scheme),
          # REDIS_URL (redis scheme), and APP_SECRET (32+ chars).
          # The bundled-services engine (ADR-0045, #612) exists but
          # no shipped entry declares it yet — its consumer slice
          # owns the migration: a version declaring postgres + redis
          # gets both url_envs composed at deploy and these two
          # required inputs disappear (the takeover #612 records).
          # Until then both connection strings are the owner's
          # inputs; instance egress is open (the NetworkPolicy
          # denies ingress only), so the services may live anywhere
          # the instance can reach.
          default_storage_gb: 5
          # Live-measured on the real image (ephemeral k3d pods at
          # medium's exact allocation): ~26s cold boot to a green
          # /api/health including first-run migrations, 139-165 MB
          # anonymous RSS at idle, 427-445 Mi pod working set. It
          # survives micro's 512 Mi through boot, but that is idle
          # with zero content — a real team's wiki grows past it, and
          # the issue's own research floor is ~1 GB. medium (0.5 CPU
          # / 1 GB, $3.69) is the honest recommendation; the wizard
          # warns below it and owners can resize later.
          default_cpu_cores: "0.5"
          default_memory_mb: 1024
          recommended_size: medium
          # Privacy-honest default (the platform's stance, disclosed
          # in the PR): upstream phones home anonymous telemetry
          # unless DISABLE_TELEMETRY is set, and env is a deploy-time
          # snapshot — a host platform should not ship customer
          # instances that report to upstream by default. Owners who
          # want it back can flip the default_env_vars row.
          default_env_vars:
            DISABLE_TELEMETRY: "true"
          release_notes: |
            First FluxVale catalog release, tracking upstream v0.97.0.
            One Node server for the wiki. Pages and accounts live in
            the PostgreSQL database connected at deploy time,
            real-time editing uses the Redis server connected at
            deploy time, and uploaded files stay on the instance
            volume. The first account created on the setup page
            becomes the workspace admin.
          published_at: "2026-11-09T02:00:00Z"
          configurable_env_vars:
            DATABASE_URL:
              label: PostgreSQL connection string
              description: >-
                Docmost keeps every page and account in PostgreSQL.
                Paste a connection string this instance can reach over
                the network, like
                postgresql://user:password@host:5432/docmost. The
                database is yours to run, back up, and restore.
              type: string
              required: true
              secret: true
            REDIS_URL:
              label: Redis connection string
              description: >-
                Real-time editing and background jobs need Redis.
                Paste a connection string this instance can reach over
                the network, like redis://user:password@host:6379.
                The Redis server stays yours to run.
              type: string
              required: true
              secret: true
            APP_SECRET:
              label: App secret
              description: >-
                A random string of at least 32 characters that secures
                sign-in tokens. Generate one with openssl rand -hex 32
                and keep the same value on every restart.
              type: string
              required: true
              secret: true
          # First-run contract (ADR-0034): the setup page creates the
          # workspace and the first account in one step, then answers
          # 403 forever (SetupGuard counts workspaces — verified live:
          # first POST /api/auth/setup 200, second 403, login 200,
          # wrong password 401). The Pocket ID setup-page shape, so
          # the pattern is the same atom and `env` has nothing to pin.
          # forbidden_env locks CLOUD: upstream's cloud mode short-
          # circuits the SetupGuard (isCloud returns false from
          # canActivate, the setup page never shows), so a user-set
          # CLOUD=true would block the owner's claim exactly the way
          # ActualBudget's OIDC bootstrap could (#181's failure mode;
          # the free-form user-env path #482 can carry it).
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env:
              - CLOUD
            guidance: >-
              Open the instance URL and create your account on the
              setup page. That first account becomes the workspace
              admin, and the setup page disappears once it exists, so
              claim the instance promptly. Then invite your team from
              the members settings with an invite link.
