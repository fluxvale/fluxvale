# FluxVale app catalog seed data.
#
# Adding an app is purely additive: append an entry (or a category) and
# re-run seeds — FluxVale.Seeds.seed_catalog!/0 converges existing rows to
# match the YAML, idempotently. Everything is validated at write time by the
# resources: malformed entries or env-var specs fail loudly
# (lib/flux_vale/contexts/catalog/types/env_var_schema.ex).
#
# Lookup keys — never rename an existing entry: category/app slug, and
# app_id+version for versions. Renaming orphans the old row instead of
# converging it.
#
# Field notes: default_cpu_cores is a QUOTED string (preserves Decimal
# precision). Optional version fields default to healthcheck_path "/",
# storage_mount_path "/data", default_memory_mb 256, default_storage_gb 0,
# published_at nil, env maps %{}, first_run nil (a version without a
# first-run contract must simply be usable out of the box — see ADR-0034
# for the next app's pattern).
# recommended_size is REQUIRED on every version — a slug from
# pricing_data.yaml whose COMPUTE equals the version's cpu/memory
# defaults (#558: default_storage_gb is the app's own honest storage
# default, priced per GB); seed_pricing! runs first and the seed
# runner resolves the id.
- category:
    name: Developer Tools
    slug: developer-tools
    description: >-
      Source control and developer productivity apps.
  apps:
    - name: Forgejo
      slug: forgejo
      tagline: Git forge with issues, pull requests, and Actions CI
      description: |
        Repositories, issues, pull requests, wiki, and Forgejo Actions CI in
        a lightweight, 100% free-software package. Git over HTTPS only;
        repositories and metadata live on a dedicated volume.
      icon_url: https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/assets/logo.svg
      source_url: https://codeberg.org/forgejo/forgejo
      docs_url: https://forgejo.org/docs/latest/
      versions:
        - version: "16.0.5"          # upstream stable, 2026-09-17
          image: codeberg.org/forgejo/forgejo:16.0.5
          port: 3000
          healthcheck_path: /api/healthz
          # #73's deploy op sets this to the instance's public URL —
          # Forgejo needs ROOT_URL for correct absolute links behind the
          # proxy.
          instance_url_env: FORGEJO__server__ROOT_URL
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # the callback URL registered on the Pocket ID client is the
          # instance URL plus this path. The path's third segment is the
          # authentication source's name, and Forgejo stores that config
          # in its own database (Site Administration → Authentication
          # Sources — no env surface), so the guide pins the name
          # `PocketID` to keep the two ends matching.
          oidc_callback_path: /user/oauth2/PocketID/callback
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′).
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v16.0.5.
            HTTPS-only git (SSH disabled); SQLite on a dedicated volume.
          published_at: "2026-09-17T15:27:32Z"
          # Operator-owned config (#71 scope, ADR-0031 M3): SQLite-on-PVC
          # (no CNPG dependency — the single cluster is platform-only,
          # ADR-0009); SSH disabled — the v1 port-22 lesson. #73's deploy
          # op adds FORGEJO__server__ROOT_URL per instance (the ingress
          # URL isn't catalog data). INSTALL_LOCK lives in the first-run
          # contract below — it is first-open posture, not operator
          # preference.
          default_env_vars:
            FORGEJO__database__DB_TYPE: sqlite3
            FORGEJO__server__DISABLE_SSH: "true"
          # First-run contract (#181, ADR-0034): registration is open on
          # first boot and the first registrant becomes admin.
          # DISABLE_REGISTRATION is deliberately NOT shipped — Forgejo
          # defaults it to false (open), and __section__KEY env re-applies
          # to app.ini at every container start, so pinning it would
          # silently re-open registration after the owner closes it
          # in-app. The forbidden_env lock keeps every deploy-time layer
          # from setting it at all.
          first_run:
            pattern: first_registered_user_admin
            env:
              FORGEJO__security__INSTALL_LOCK: "true"
            forbidden_env:
              - FORGEJO__service__DISABLE_REGISTRATION
            guidance: >-
              Open the instance URL and register — the first account
              becomes the admin. Once you are in, close public sign-up
              in Forgejo's site administration settings.
          # Deploy-time user settings — rendered by the #74 deploy form.
          configurable_env_vars:
            FORGEJO__mailer__ENABLED:
              label: Enable email sending
              description: Send notifications and confirmation emails via SMTP.
              type: boolean
              default: false
            FORGEJO__mailer__SMTP_ADDR:
              label: SMTP host
              description: Hostname of the SMTP server.
              type: string
            FORGEJO__mailer__SMTP_PORT:
              label: SMTP port
              description: Port of the SMTP server.
              type: integer
              default: 587
            FORGEJO__mailer__FROM:
              label: Sender address
              description: From address for outgoing mail, e.g. Forgejo <noreply@example.com>.
              type: string
            FORGEJO__mailer__USER:
              label: SMTP username
              description: Username for SMTP authentication.
              type: string
            FORGEJO__mailer__PASSWD:
              label: SMTP password
              description: Password for SMTP authentication.
              type: string
              secret: true

- category:
    name: Media & Entertainment
    slug: media
    description: >-
      Media and reading servers for your own library.
  apps:
    - name: Kavita
      slug: kavita
      tagline: Digital library for comics, manga, and ebooks
      description: |
        A fast, cross-platform reading server for a personal digital
        library — comics, manga, and ebooks with a polished in-browser
        reader, per-user reading progress, OPDS support for third-party
        clients, and OIDC SSO. All configuration happens in the web UI;
        no environment variables are needed to boot.
      icon_url: https://raw.githubusercontent.com/Kareadita/Kavita/develop/Logo/kavita.svg
      source_url: https://github.com/Kareadita/Kavita
      docs_url: https://wiki.kavitareader.com
      # File access (#190, ADR-0035): Kavita is the flagship file-access
      # app — the whole point is loading your own library. The sidecar
      # serves the volume at the app's declared mount path, so libraries
      # Kavita points into the volume are all reachable via /dav.
      file_access: true
      versions:
        - version: "0.9.1"          # upstream stable, 2026-09-02 (assembly 0.9.1.4)
          # The canonical image: built and pushed by Kavita's own release
          # workflow (release-workflow.yml) — jvmilazz0/kavita on Docker
          # Hub is the same workflow's second target, not a distinct build.
          # Tag is major.minor: upstream tags stable releases by the
          # truncated assembly version, so `0.9.1` is what the workflow
          # publishes for 0.9.1.4.
          image: ghcr.io/kareadita/kavita:0.9.1
          port: 5000
          healthcheck_path: /api/health
          # Kavita's persistent state is NOT on the volume root: it
          # resolves its config dir from the container's working
          # directory (/kavita), so the SQLite DB, JWT signing key,
          # covers and backups only survive a pod restart when the PVC
          # lands at /kavita/config (#189). The deployer's per-version
          # mount path makes that catalog data instead of a special case.
          storage_mount_path: /kavita/config
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # Kavita's OIDC setup (Settings → Server → OpenID Connect) is
          # in-app with a restart to apply, no env surface. The guide's
          # optional logout callback is /signout-callback-oidc.
          oidc_callback_path: /signin-oidc
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′).
          # Kavita runs on as little as 256 MB (upstream guidance), but
          # library scans are image-heavy (NetVIPS cover generation), so
          # the shipped recommendation keeps scan headroom.
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v0.9.1
            (0.9.1.4). SQLite on a dedicated volume mounted at
            /kavita/config; the admin account is created on first open.
          published_at: "2026-09-02T21:07:38Z"
          # First-run contract (#189, ADR-0034): Kavita's first boot
          # shows the registration page and POST /api/account/register
          # makes the first registrant the admin — its own UI redirects
          # to /register until an admin exists, so claiming is one click.
          # There are no env knobs to pin or lock: all configuration
          # (including closing sign-up) lives in Kavita's admin UI, so
          # `env` and `forbidden_env` are both empty.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            guidance: >-
              Open the instance URL and register — the first account
              becomes the admin. Kavita is then yours to configure in
              its own admin settings; a library scan needs files on the
              server first, which the upcoming file-access feature will
              provide.

- category:
    name: Productivity
    slug: productivity
    description: >-
      Notes and personal knowledge apps.
  apps:
    - name: Memos
      slug: memos
      tagline: Lightweight note stream for your everyday thoughts
      description: |
        A fast, self-hosted note stream for quick thoughts, lists, and
        links. Memos are Markdown, stay private until you share them,
        and are searchable by tag and date. The web UI is at home on
        phones and desktops, and everything is stored in a single
        SQLite database on the instance volume.
      icon_url: https://raw.githubusercontent.com/usememos/memos/main/web/public/logo.svg
      source_url: https://github.com/usememos/memos
      docs_url: https://usememos.com/docs
      versions:
        - version: "26.11.0"          # upstream stable, 2026-11-01
          # The canonical image: built and pushed by Memos' own release
          # workflow (release.yml) to Docker Hub and GHCR under the same
          # tags. Exact calendar-version tag, like Forgejo's pin.
          image: ghcr.io/usememos/memos:26.11.0
          port: 5230
          healthcheck_path: /healthz
          # The image's own VOLUME: the SQLite DB (memos_prod.db) and
          # attachments live under /var/opt/memos, which is also the
          # container's working directory, so the PVC mounts exactly
          # there (the Kavita reasoning — state must land under the
          # app's own paths to survive a pod restart).
          storage_mount_path: /var/opt/memos
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # Memos' SSO settings (Settings → SSO, the Custom template)
          # are in-app, with the authorization, token, and userinfo
          # endpoints entered explicitly because Memos reads no
          # discovery URL. The identifier maps to preferred_username
          # (Pocket ID's own Memos guide).
          oidc_callback_path: /auth/callback
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB
          # — exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′). Memos is a
          # static Go binary over SQLite with
          # no external services; upstream's whole pitch is featherweight,
          # so the ladder's floor is honest headroom, not a squeeze.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream 26.11.0.
            SQLite on a dedicated volume mounted at /var/opt/memos. The
            host account is created on first open.
          published_at: "2026-11-01T14:04:41Z"
          # First-run contract (#181, ADR-0034): Memos boots into
          # first-user setup mode — the first account created becomes
          # the host (admin). Registration is open by default
          # (upstream's own test suite pins it) and is closed in the
          # admin UI afterwards; that toggle is a stored instance
          # setting with no env override, so there is no env key to pin
          # or lock — `env` and `forbidden_env` are both empty, the
          # Kavita shape.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            guidance: >-
              Open the instance URL and create your account. The first
              account becomes the host (admin). Then close public
              sign-up in Memos' admin settings so no one else can
              register.

- category:
    name: Security
    slug: security
    description: >-
      Password managers and other servers that hold secrets you control.
  apps:
    - name: Vaultwarden
      slug: vaultwarden
      tagline: Bitwarden-compatible password server for your own vault
      description: |
        A Bitwarden-compatible password server written in Rust. Vault
        contents are encrypted and decrypted on your devices, and the
        server only ever holds ciphertext. As the operator of your own
        instance you still see account metadata such as email addresses
        and login times, and any hosted password server can in principle
        serve modified web vault code. That is the same trust class as
        any hosted password manager, with the operator role kept by you.
        The admin panel is disabled in this packaging and sign-ups stay
        open on the instance URL, so create your account soon after
        deploying.
      icon_url: https://raw.githubusercontent.com/dani-garcia/vaultwarden/1.37.5/resources/vaultwarden-icon.svg
      source_url: https://github.com/dani-garcia/vaultwarden
      docs_url: https://github.com/dani-garcia/vaultwarden/wiki
      versions:
        - version: "1.37.5"          # upstream stable, 2026-11-01
          # The canonical upstream image: Docker Hub is the release
          # workflow's primary target (ghcr.io and quay.io carry the
          # same build). Tag is the exact upstream release version.
          image: docker.io/vaultwarden/server:1.37.5
          port: 80
          # Vaultwarden's own health endpoint — the upstream image's
          # HEALTHCHECK probes the same path. A plain unauthenticated 200.
          healthcheck_path: /alive
          # The deployer injects the instance's public URL into this env
          # var (Forgejo's ROOT_URL pattern): Vaultwarden derives absolute
          # URLs (web vault, attachments) from DOMAIN.
          instance_url_env: DOMAIN
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # the URL registered on the Pocket ID client is the instance
          # URL plus this path (upstream's SSO wiki pins it).
          oidc_callback_path: /identity/connect/oidc-signin
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB —
          # exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′). Honest in
          # both directions (#492): a single Rust binary
          # with SQLite, no server-side vault crypto (clients do the
          # end-to-end work), and upstream runs it on far less than this.
          # 512 MB keeps attachment sync comfortable, and logins are
          # bursty (one server-side hash per sign-in), so 0.25 CPU covers
          # personal use. Attachment-heavy vaults can move up a rung in
          # the stepper.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v1.37.5.
            SQLite on a dedicated volume at /data. The admin panel is
            disabled (no admin token is configured) and sign-ups stay
            open on the instance URL, so create your account right after
            deploying. Point your Bitwarden apps at the instance URL.
          published_at: "2026-11-01T22:16:50Z"
          # No first-run contract (ADR-0034 leaves the contract optional
          # per app): first open shows the web vault with account
          # creation open, usable out of the box. The admin-panel-off
          # posture (#492) is one of ABSENCE — no ADMIN_TOKEN exists in
          # any packaging layer (defaults, deploy-time settings, a
          # first-run env), so nothing re-applies at boot that could
          # weaken it. The catalog data + seed tests pin the absence.
          #
          # The one deploy-time setting is the sign-ups domain whitelist:
          # with the admin panel off and no post-deploy env editing,
          # deploy time is the only chance to scope registration. Upstream's
          # SIGNUPS_ALLOWED is deliberately NOT shipped — setting it false
          # at deploy time locks the owner out of a fresh instance (no
          # admin panel to undo it).
          configurable_env_vars:
            SIGNUPS_DOMAINS_WHITELIST:
              label: Restrict sign-ups to an email domain
              description: Only email addresses at this domain can register. Leave empty to let anyone with the URL register.
              type: string
            # #511: the SSO wiring as deploy-time inputs — env is a
            # deploy-time snapshot (no post-deploy editing), so an
            # already-running instance is wired by redeploying with the
            # values. SSO_PKCE and SSO_SCOPES keep upstream defaults,
            # which match a Pocket ID client created with PKCE on.
            # SSO_AUTHORITY must equal the Pocket ID instance URL
            # exactly (it is the issuer). The master password keeps
            # unlocking the vault regardless: SSO gates the front door
            # only.
            SSO_ENABLED:
              label: Enable Pocket ID sign-in
              description: Sign in through the OpenID Connect provider below. The master password keeps unlocking the vault either way.
              type: boolean
              default: false
            SSO_AUTHORITY:
              label: OIDC issuer URL
              description: The Pocket ID instance's public URL with no trailing slash. It must match exactly.
              type: string
            SSO_CLIENT_ID:
              label: OIDC client ID
              description: The client ID from the Pocket ID OIDC client.
              type: string
            SSO_CLIENT_SECRET:
              label: OIDC client secret
              description: The client secret from the Pocket ID OIDC client. Pocket ID shows it once when the client is created.
              type: string
              secret: true
          # #597: the automatic-wiring recipe — presence = the deploy
          # wizard can offer "sign in with your Pocket ID" for this
          # version. kind env = the platform injects everything at
          # deploy: it mints the Pocket ID client and writes the four
          # SSO_* inputs above server-side (the manual values stay the
          # fallback). pkce matches a Pocket ID client created with
          # PKCE on. The names must exist in configurable_env_vars and
          # the secret must be secret-typed — enforced at write time,
          # so an upstream env rename fails the seed, not the deploy.
          # Per-version data: more apps join by declaring a recipe
          # (D4); Pocket ID itself and the in-app-configured consumers
          # (Forgejo, Kavita, Memos) carry none in v1.
          oidc_wiring:
            kind: env
            issuer_env: SSO_AUTHORITY
            client_id_env: SSO_CLIENT_ID
            client_secret_env: SSO_CLIENT_SECRET
            enabled_env: SSO_ENABLED
            pkce: true

- category:
    name: Identity
    slug: identity
    description: >-
      Sign-in and identity apps that secure access to your other apps.
  apps:
    - name: Pocket ID
      slug: pocket-id
      tagline: Passkey-first OpenID Connect provider
      description: |
        A featherweight OpenID Connect (OIDC) provider built around
        passkeys. Sign in to your other apps with passkeys instead of
        passwords, with OIDC client management, users and groups, and a
        sign-in audit log. The embedded SQLite database and uploads live
        on a dedicated volume, and all configuration happens in the web
        UI after a one-time encryption key at deploy. Other apps can use
        this instance as their sign-in provider, which makes it
        load-bearing. Turn on the always-on flag after deploy, because
        a sleeping Pocket ID answers your apps' sign-ins with errors
        while it wakes. Keep the instance public so your apps can reach
        it, and save the encryption key, because restoring a backup
        needs it.
      icon_url: https://raw.githubusercontent.com/pocket-id/pocket-id/main/frontend/static/img/static-logo.svg
      source_url: https://github.com/pocket-id/pocket-id
      docs_url: https://pocket-id.org/docs/introduction
      versions:
        - version: "2.19.2"          # upstream stable, 2026-11-02
          # The canonical image, built and pushed by Pocket ID's own
          # release workflow; `pocketid/pocket-id` on Docker Hub is the
          # same build, not a distinct one. Upstream tags releases with
          # a `v` prefix, which the image keeps.
          image: ghcr.io/pocket-id/pocket-id:v2.19.2
          port: 1411
          healthcheck_path: /healthz
          # #73's deploy op sets this to the instance's public URL:
          # passkeys are bound to the domain, and every OIDC URL Pocket
          # ID hands out is built from APP_URL (the app trims the
          # trailing slash itself).
          instance_url_env: APP_URL
          # Pocket ID keeps everything in one place: the embedded SQLite
          # DB (`DB_CONNECTION_STRING` defaults to a path relative to the
          # container's working dir /app), uploads, and the GeoLite cache
          # all resolve under /app/data — exactly the directory the
          # upstream compose file mounts a volume at. The image's own
          # entrypoint chowns it to PUID/PGID 1000 before dropping
          # privileges, so the PVC lands correctly owned.
          storage_mount_path: /app/data
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          default_storage_gb: 5
          # The compute class (#125, #558): `micro` is 0.25 CPU / 512 MB —
          # exactly this version's compute ($2.59/mo), and 5 GB is the
          # app's own storage default ($0.24/mo per-GB — B′).
          # The honest floor: Pocket ID is a single static Go binary with
          # an embedded SQLite DB, idling at tens of MB. Availability is
          # not a sizing question for the identity instance (#511): it
          # wants the instance's always-on flag, not a bigger size.
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v2.19.2.
            SQLite on a dedicated volume mounted at /app/data. The admin
            account is created on first open.
          published_at: "2026-11-02T20:18:20Z"
          # Operator-owned config: TRUST_PROXY — upstream's stated
          # condition for `true` is that Pocket ID "can't be reached
          # without going through your proxy", which is every FluxVale
          # instance (k8s Service behind Traefik). Without it the audit
          # log and rate limits would key on the proxy address instead
          # of the client's.
          default_env_vars:
            TRUST_PROXY: "true"
          # First-run contract (ADR-0034): /setup answers only until the
          # first account exists and that account is the admin —
          # registration is open on first boot in exactly the Kavita
          # sense. No env lever touches it: user sign-ups default to
          # disabled (they live in the admin UI), so there is nothing to
          # pin and nothing to lock.
          first_run:
            pattern: first_registered_user_admin
            env: {}
            forbidden_env: []
            guidance: >-
              Open the instance URL and create your account on the setup
              page, then add a passkey. That first account is the admin,
              and the setup page disappears once it exists, so claim the
              instance promptly. Sign-ups stay closed afterwards unless
              you turn them on in the admin settings.
          # Pocket ID's one required variable (its only hard boot gate):
          # ENCRYPTION_KEY encrypts the token-signing keys at rest, and
          # the app refuses to start with fewer than 16 bytes. There is
          # no upstream default and the platform mints no per-instance
          # secrets, so the owner picks it at deploy time (upstream's
          # recipe is `openssl rand -base64 32`). It ships as the
          # version's single deploy-time input, secret-shaped, and lands
          # in the instance's K8s Secret.
          configurable_env_vars:
            ENCRYPTION_KEY:
              label: Encryption key
              description: >-
                Encrypts Pocket ID's stored secrets. Generate one with
                openssl rand -base64 32 (at least 16 characters) and
                save it somewhere safe, because restoring a backup of
                this instance needs it.
              type: string
              required: true
              secret: true

- category:
    name: Finance
    slug: finance
    description: >-
      Budgeting and money apps for the household.
  apps:
    - name: ActualBudget
      slug: actualbudget
      tagline: Envelope budgeting shared by the whole household
      description: |
        Local-first envelope budgeting for the household. Budgets sync
        across devices and family members sign in with the shared
        server password you set on first open. Transactions, reports,
        and statement imports run in the browser, and budget files
        live on a dedicated volume. Bank sync works with your own
        SimpleFIN token.
      # The repo's logo.svg is the white-glyph-on-transparent variant
      # (both paths fill="white") — invisible on the light icon tile.
      # The apple-touch icon is the same mark, self-contained: white
      # glyph on the solid purple field (#5D3DBA).
      icon_url: https://raw.githubusercontent.com/actualbudget/actual/v26.11.0/packages/desktop-client/public/apple-touch-icon.png
      source_url: https://github.com/actualbudget/actual
      docs_url: https://actualbudget.org/docs/
      versions:
        - version: "26.11.0"          # upstream stable, 2026-11-02
          # The canonical image: ghcr and Docker Hub publish the same
          # build (identical amd64 manifest digest, sha256:c56adb68…),
          # and ghcr dodges Docker Hub's anonymous pull limits on
          # shared CI runners. This is the project's own supported
          # container (actualbudget.org/docs/install/docker), not a
          # community repackage.
          image: ghcr.io/actualbudget/actual-server:26.11.0
          port: 5006
          # Sync-server router (v26.11.0 tag): GET /health answers 200
          # {"status":"UP"} with no dependency checks.
          healthcheck_path: /health
          # The image's data dir defaults to /data when it exists, and
          # the server splits state under it: account.sqlite (hashed
          # server password + budget file list) in /data/server-files,
          # budget blobs in /data/user-files. The default volume root
          # is the right mount, no per-app override needed. The image
          # runs as UID 1001 (upstream USER_UID) and only chowns /data
          # at build time, so the volume must be writable by that UID —
          # local-path provisioning is; a root-owned CSI volume would
          # need an fsGroup the deployer does not set today.
          storage_mount_path: /data
          # #73's deploy op fills this with the instance's public URL
          # (the Forgejo ROOT_URL pattern): upstream's OpenID setup
          # needs the server hostname so the provider redirects back
          # here. Inert until OpenID is configured.
          instance_url_env: ACTUAL_OPENID_SERVER_HOSTNAME
          # #511: the OIDC callback path for sign-in-with-Pocket ID —
          # upstream pins <server hostname>/openid/callback as the
          # redirect URI to register on the provider's client.
          oidc_callback_path: /openid/callback
          default_cpu_cores: "0.5"
          default_memory_mb: 512
          default_storage_gb: 10
          # The compute class (#125, #558): `small` is 0.5 CPU / 512 MB —
          # exactly this version's compute ($2.95/mo), and 10 GB is the
          # app's own storage default ($0.40/mo per-GB — B′). Idle RSS
          # measured ~110 MB on 26.11.0, so `micro` boots.
          # The classes differ in CPU only (both are 512 MB): 0.25 CPU
          # throttles sync and report work on real
          # budgets, and attachments grow past 5 GB. The stepper's
          # first impression should not undersell a financial records
          # app; `small` matches the shipped unit.
          recommended_size: small
          release_notes: |
            First FluxVale catalog release, tracking upstream v26.11.0.
            SQLite on a dedicated volume mounted at /data. The first
            open sets the server password, which family members share
            to sign in.
          published_at: "2026-11-02T01:54:02Z"
          # #511 + #521: the OpenID wiring rides deploy-time inputs (the
          # Vaultwarden SSO reasoning — env is a deploy-time snapshot),
          # MINUS the two bootstrap triggers. The first-run contract is
          # the sole owner of ACTUAL_OPENID_DISCOVERY_URL and
          # ACTUAL_OPENID_AUTHORIZATION_ENDPOINT (#521 — the seed
          # refuses any overlap), so the discovery URL is not a deploy
          # input and the packaging wires no OpenID claim path. The
          # remaining knobs are the non-triggering cast-through inputs.
          configurable_env_vars:
            ACTUAL_OPENID_CLIENT_ID:
              label: OpenID client ID
              description: The client ID from the Pocket ID OIDC client.
              type: string
            ACTUAL_OPENID_CLIENT_SECRET:
              label: OpenID client secret
              description: The client secret from the Pocket ID OIDC client. Pocket ID shows it once when the client is created.
              type: string
              secret: true
            ACTUAL_USER_CREATION_MODE:
              label: Create users on first sign-in
              description: Set to login to create an account the first time someone signs in with OpenID. Leave empty to pre-create accounts in Actual's Users screen instead.
              type: string
          # First-run contract (#492, ADR-0034 Am. 1): a fresh sync
          # server ships unclaimed (GET /account/needs-bootstrap →
          # bootstrapped:false), and the web UI's first open IS the
          # claim — set the server password (POST /account/bootstrap,
          # one-time, refuses after). There is no registration and no
          # admin seat: everyone signs in with that one shared
          # password, so `first_registered_user_admin` misnames it.
          # The `first_open_sets_password` pattern documents the shape.
          # `forbidden_env` closes the user-env injection path (#482
          # lets instances carry free-form env vars through to the
          # container): ACTUAL_OPENID_DISCOVERY_URL and
          # ACTUAL_OPENID_AUTHORIZATION_ENDPOINT are the two upstream
          # keys whose presence triggers the boot-time OIDC bootstrap
          # (sync-server run() calls bootstrap({openId}, true) when
          # either is set). With user-injected ACTUAL_OPENID_CLIENT_ID
          # and ACTUAL_OPENID_SERVER_HOSTNAME alongside, that bootstrap
          # succeeds and the server is claimed before the owner's first
          # open, so locking the necessary triggers closes the
          # env-injected claim path; the remaining OIDC knobs alone
          # cannot trigger it. Everything else upstream ships is
          # operator-side config that the packaging does not expose.
          # Verified against ghcr.io/actualbudget/actual-server:26.11.0:
          # the bootstrapped flag and the password survive a pod
          # recreation on the same volume.
          first_run:
            pattern: first_open_sets_password
            env: {}
            forbidden_env:
              - ACTUAL_OPENID_DISCOVERY_URL
              - ACTUAL_OPENID_AUTHORIZATION_ENDPOINT
            guidance: >-
              Open the instance URL and set the server password. That
              first open claims the instance, so do it right after
              deploying, and the password you choose is what everyone
              signs in with. Share it only with people you trust with
              your budget. Change the password from Actual's user menu
              to cut off access later.

- category:
    name: Analytics
    slug: analytics
    description: >-
      Web analytics and visitor insight apps for the sites you run.
  apps:
    - name: Umami
      slug: umami
      tagline: Cookieless web analytics you host yourself
      description: |
        Web analytics you host yourself. See pageviews, visitors, and
        events for each site, with funnels, journeys, retention,
        revenue, session replay, and heatmaps built in. Tracking works
        without cookies, so no consent banner is needed. Umami is MIT
        licensed. All data lives in a PostgreSQL database you connect
        at deploy time, and that database stays yours to run and back
        up. Sign in soon after deploying, because a fresh install
        answers to a default admin account.
      # The repo's apple-touch-icon is the self-contained mark (the
      # ActualBudget lesson): a black glyph on a solid white field, so
      # it reads on the icon tile in both themes. The repo's other
      # assets (favicon PNGs, safari-pinned-tab.svg) are black-on-
      # transparent and vanish on the dark tile.
      icon_url: https://raw.githubusercontent.com/umami-software/umami/v3.4.1/public/apple-touch-icon.png
      source_url: https://github.com/umami-software/umami
      docs_url: https://umami.is/docs
      versions:
        - version: "3.4.1"          # upstream stable, 2026-10-23
          # The canonical image (upstream's own release pipeline pushes
          # GHCR), pinned by exact tag. Unlike Pocket ID, Umami's image
          # tags carry NO v prefix — v3.4.1 does not exist in the
          # registry (verified against the GHCR v2 API; 3.4.1 resolves
          # to the multi-arch index, digest sha256:f2c645cc…).
          image: ghcr.io/umami-software/umami:3.4.1
          port: 3000
          # The image's own HEALTHCHECK probes the same path
          # (docker-compose v3.4.1): an unauthenticated 200 {"ok":true}.
          healthcheck_path: /api/heartbeat
          # Stateless by design: Umami keeps every row (websites,
          # events, sessions, accounts) in the PostgreSQL database named
          # by DATABASE_URL, and the container writes nothing it needs
          # back. default_storage_gb 0 means the deployer never mounts a
          # PVC (#558's honest per-app storage default — the storage
          # axis is simply empty for this app), so the loader's
          # storage_mount_path default never applies.
          default_storage_gb: 0
          # The compute class (#125, #558): `micro` is 0.25 CPU /
          # 512 MB — exactly this version's compute ($2.59/mo) plus
          # $0/GB of storage. A single Node process (Next standalone
          # server) that idles around 200 MB (#576's stated figure);
          # the boot-time prisma migration runs in the same budget as a
          # separate process (start-docker.sh execs the server only
          # after check-db exits), so the floor holds.
          default_cpu_cores: "0.25"
          default_memory_mb: 512
          recommended_size: micro
          release_notes: |
            First FluxVale catalog release, tracking upstream v3.4.1.
            One stateless Node server, all data in the PostgreSQL
            database connected at deploy time. The first open signs in
            with the default admin account and changes its password.
          published_at: "2026-11-08T01:20:00Z"
          # DATABASE_URL is the app's whole storage story, and the
          # platform provisions no per-app databases (OQ #14: where
          # customer DBs would live is deliberately unsettled — ADR-0009
          # names only first-party tenants). So the connection string
          # ships as the owner's one required input, the Pocket ID
          # ENCRYPTION_KEY precedent (the platform mints no per-instance
          # secrets or services). Egress from instance namespaces is
          # open, so the database may live anywhere the instance can
          # reach. A future DB-provisioning layer would own this key
          # exactly the way the deployer owns instance_url_env.
          #
          # APP_SECRET (still the v3 name — checked at tag v3.4.1, not
          # renamed) salts the app's signed tokens; upstream falls back
          # to hashing DATABASE_URL when unset, which is why an explicit
          # value ships as a required input instead.
          #
          # TWO_FACTOR_ENCRYPTION_KEY is optional: enabling two-factor
          # sign-in inside the app 503s without it (the 2FA setup route
          # refuses while "secrets cannot be stored without an
          # encryption key"), and env is a deploy-time snapshot, so an
          # owner who wants 2FA must set it here.
          configurable_env_vars:
            DATABASE_URL:
              label: PostgreSQL connection string
              description: >-
                Umami keeps everything in PostgreSQL. Paste a connection
                string this instance can reach over the network, like
                postgresql://user:password@host:5432/dbname. The
                database is yours to run, back up, and restore.
              type: string
              required: true
              secret: true
            APP_SECRET:
              label: App secret
              description: >-
                A random string that secures the tokens Umami issues at
                sign-in. Generate one with openssl rand -base64 32 and
                keep the same value on every restart.
              type: string
              required: true
              secret: true
            TWO_FACTOR_ENCRYPTION_KEY:
              label: Two-factor encryption key
              description: >-
                Only needed if you plan to turn on two-factor sign-in.
                Generate one with openssl rand -hex 32. Umami cannot
                store two-factor secrets without it.
              type: string
              secret: true
          # First-run contract (ADR-0034 Am. 2): upstream's own first
          # migration inserts the default admin (username admin,
          # password umami — the README pins both), so the claim is
          # sign-in-then-change-password. `env` is empty (nothing to
          # pin). `forbidden_env` locks the two boot flags whose
          # presence would skip that migration and leave a fresh
          # install with no admin at all: SKIP_DB_CHECK exits
          # check-db.js before migrations run, SKIP_DB_MIGRATION skips
          # the migrate step itself (both read in the image's
          # start-docker.sh path; the free-form user-env path #482 can
          # carry either).
          first_run:
            pattern: default_admin_credentials
            env: {}
            forbidden_env:
              - SKIP_DB_CHECK
              - SKIP_DB_MIGRATION
            guidance: >-
              Open the instance URL and sign in with username admin and
              password umami. Change that password right away, because
              every Umami install starts with the same one. Then add
              your first website in Umami to get its tracking snippet.
