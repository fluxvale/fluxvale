# FluxVale app catalog seed data — intentionally EMPTY right now.
#
# #70 shipped the domain + seeding machinery with no entries: Kavita (v1's
# seed) was dropped pre-merge — a library app is useless without file
# access, and SFTP is deferred post-beta (OQ #6). The first entry is
# Forgejo (#71): SQLite-on-PVC, HTTPS-only git, no SFTP dependency
# (ADR-0031 M3).
#
# Adding a catalog app is purely additive: append a new entry under the
# appropriate category (or add a new category). The seed logic in
# FluxVale.Seeds.seed_catalog!/0 iterates over this data and converges
# existing rows to match, so re-running seeds is fully idempotent.
#
# Type notes:
#   - default_cpu_cores: quoted string ("0.5") to preserve Decimal precision
#   - published_at: ISO 8601 string, parsed to DateTime at load time
#   - default_env_vars / configurable_env_vars: omitted when empty (default %{})
#   - default_memory_mb/default_storage_gb/published_at: optional — loader
#     falls back to the resource defaults (256/0/nil)
