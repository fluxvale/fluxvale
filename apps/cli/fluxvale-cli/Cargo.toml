[package]
name = "fluxvale-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false # workspace-internal; distribution is release binaries

# The distributed binary is `fluxvale` (ADR-0019 Am. 3); the crate keeps
# the workspace-internal fluxvale-cli name.
[[bin]]
name = "fluxvale"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104" # top-level error plumbing (command handlers)
clap = { version = "4.6.7", features = ["derive"] }
fluxvale-api = { path = "../../../crates/fluxvale-api" } # the /api/v1 client: wire, device flow, token value type (repo-root crates/ workspace)
keyring = "4.2.0" # OS keychain; default `v1` feature = macOS Keychain + Windows Credential Manager + Linux Secret Service
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[dev-dependencies]
keyring-core = "1" # the mock store: injects the op-time set_password failure the keychain-fallback test needs
