# This workspace's cargo-deny gates — a copy of apps/cli/deny.toml
# (and crates/), kept in sync with them (edit all three or none).
#
# cargo-deny warns on entries nothing currently uses ("unmatched
# license allowance") — harmless, and the entries stay: future deps
# ride the same resolution chain as the CLI's and may need them.
[licenses]
# The allowlist is the whole contract: anything not listed is denied
# by default — the GPL family (GPL/LGPL/AGPL) included. GNU licenses
# match exactly (cargo-deny 0.18.4+), so `-only`/`-or-later` variants
# cannot slip through an allow entry.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    # webpki-roots (ureq's default rustls root store) is DATA — Mozilla's
    # root bundle — under this permissive data license; the crate is not
    # separable from ureq's `rustls` feature (the scaffold PR that added
    # ureq, T2 of #362).
    "CDLA-Permissive-2.0",
]

# Our own crates are FSL-1.1-ALv2 and never published (the server ships
# as a container image in W3) — skipped here so the allowlist stays the
# third-party-only contract.
[licenses.private]
ignore = true

[advisories]
# Vulnerabilities are always errors in current cargo-deny (the old
# per-lint levels were removed) — no field to set.
# Unmaintained: the "warn" level no longer exists; values are
# all/workspace/transitive/none. `none` is the non-blocking equivalent.
unmaintained = "none"
