# Gitleaks config for the nightly secret scan job in
# .github/workflows/pentest.yml (issue #528). Default rule set only,
# loaded via extend. The allowlist is the evidence-built baseline: every
# entry maps to a real finding from a local gitleaks 8.30.1 run and says
# why it is safe. Anything new that no entry covers reds the nightly job.
[extend]
useDefault = true

# Phoenix-standard dev/test config literals. dev.exs documents the stance
# in place: prod reads runtime env (config/runtime.exs), these values
# never leave the machine. Scoped to the two files AND the key names, so
# a stray real secret beside them still trips.
[[allowlists]]
description = "dev/test config signing-key literals (prod reads runtime env)"
condition = "AND"
paths = ['''apps/platform/config/(dev|test)\.exs$''']
regexTarget = "line"
regexes = ['''(secret_key_base|token_signing_secret)''']

# Test fixture: a fake restic password (base64 of a change-me
# placeholder) and the assertion reading it back. Test-only doubles, no
# real value can appear in this file.
[[allowlists]]
description = "backup-credential test fixture fakes"
condition = "AND"
paths = ['''read_backup_credential_test\.exs$''']
regexTarget = "line"
regexes = ['''(RESTIC_PASSWORD|repo_password)''']

# actions/cache cache keys ("key: cargo-deny-0.20.2" and friends): the
# generic-api-key heuristic fires on the "key:" label. Not secrets.
[[allowlists]]
description = "actions/cache cache-key lines in ci.yml"
condition = "AND"
paths = ['''\.github/workflows/ci\.yml$''']
regexTarget = "line"
regexes = ['''^[[:space:]]*key: cargo-''']
