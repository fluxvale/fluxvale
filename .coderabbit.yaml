# One review per PR (#59) — 0-star OSS tier: ~1 review/hour per
# developer per repo (docs.coderabbit.ai/management/plans). Procedure:
# fluxvale-review-budget skill. Supersedes #50's pause (#49).
reviews:
  auto_review:
    # No auto-re-reviews on pushes. Doesn't govern the opening review,
    # which may auto-fire (#60) — the discipline is behavioral.
    auto_incremental_review: false

  path_filters:
    # ash codegen noise. path_filters also drive the bot's
    # sparse-checkout — docs/ stays unfiltered so the ADRs remain in
    # its review context.
    - "!**/priv/resource_snapshots/**"
