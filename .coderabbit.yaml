# One CodeRabbit review per PR (#59). The repo is public at 0 stars:
# the OSS tier allows ~1 review/hour per developer per repository, and
# public repos under 10 stars require manual triggering
# (docs.coderabbit.ai/management/plans) — the one review is obtained
# with a single `@coderabbitai review` once the PR is open and the
# branch is final quality (fresh-eyes pass + mix ci first). Findings
# are adopted/rebutted in-thread without a second bot pass; the
# maintainer verifies fixes. Supersedes #50's
# auto_pause_after_reviewed_commits: 1 (#49).
reviews:
  auto_review:
    # Never auto-re-review on pushes after the opening state — at most
    # one automatic review per PR. Today (0 stars) nothing
    # auto-reviews anyway; this key is the guard for when the repo
    # gains stars or a trial and automatic reviews become possible.
    # The one-review policy itself is behavioral, not enforceable by
    # config: a manual `@coderabbitai review` remains technically
    # possible, and the review-budget skill forbids using it more than
    # once per PR.
    auto_incremental_review: false

  path_filters:
    # ash_postgres codegen output — generated snapshots are review noise.
    # NB: path_filters also drive CodeRabbit's sparse-checkout, so this
    # removes snapshots from the bot's clone entirely — harmless for
    # generated JSON, which is why docs/ is deliberately NOT filtered
    # here: the bot's review context must keep the ADRs ("everything why
    # lives in docs/", AGENTS.md).
    - "!**/priv/resource_snapshots/**"
