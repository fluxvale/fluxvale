# Local dev cluster manifests (ADR-0020). These STAY in the public app
# repo permanently (ADR-0020 Am. 2): the fleet repo (M4) carries its own
# staging/production base manifests, and the duplication is accepted so
# public-repo contributors can run the full production-parity dev stack
# without private-repo access.
apiVersion: v1
kind: Namespace
metadata:
  name: fluxvale-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxvale-platform
  namespace: fluxvale-dev
# In-cluster k8s client config (ADR-0020 parity ledger). RBAC grows with
# the client's actual needs at M3 — nothing over-granted speculatively.
