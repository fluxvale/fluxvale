# Traefik v3 CRD. Self-signed default cert stands in for Let's Encrypt
# (ADR-0020 parity ledger).
#
# Applied via k8s_custom_deploy (not k8s_yaml): the IngressRoute CRD ships
# with the Traefik chart, which installs after Tilt's static apply pass.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fluxvale-platform
  namespace: fluxvale-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`app.fluxvale.lvh.me`)
      kind: Rule
      services:
        - name: fluxvale-platform
          port: 4000
---
# The MCP server's route (W3a of #484): same entrypoint, same
# self-signed default cert. Traefik preserves the client's Host
# header, which is exactly why the mcp deployment sets
# MCP_ALLOWED_HOSTS — the guard admits this hostname and nothing else.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fluxvale-mcp
  namespace: fluxvale-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp.fluxvale.lvh.me`)
      kind: Rule
      services:
        - name: fluxvale-mcp
          port: 4600
