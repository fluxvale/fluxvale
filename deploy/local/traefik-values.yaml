# Traefik values for the local cluster (ADR-0020: chart in both envs).
# 80/443 terminate on the k3d loadbalancer's port maps; 443 serves the
# chart's default self-signed cert (stands in for Let's Encrypt DNS-01).
deployment:
  replicas: 1
service:
  type: LoadBalancer
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesCRD:
    # #203 (ADR-0036): sleeping instances' edge routes target a `wake`
    # ExternalName Service (namespace-local, pointing at the platform)
    # — Traefik refuses ExternalName targets unless this is on. The
    # fleet repo's prod copy needs the same line (the ADR's rollout
    # note: wake-on-use is dark in prod until it lands).
    allowExternalNameServices: true
