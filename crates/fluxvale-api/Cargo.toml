[package]
name = "fluxvale-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false # workspace-internal; shared by the CLI and the MCP server

[dependencies]
anyhow = "1.0.104" # the device flow's error plumbing (matches the CLI's)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21" # ApiError's own variants
ureq = "3.5.1" # defaults = rustls + gzip; no native-tls anywhere
