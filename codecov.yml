# Codecov — monorepo: one flag per app, per-flag statuses (one app's
# coverage can't fail another's check). A new app adds a flag here plus
# a `flags:` input on its CI upload step (e2e joins at M3).
#
# Why marker-ignored lines never red these checks: excoveralls exports
# coveralls-ignore'd lines as null, and codecov counts null as not
# coverable — a patch red is a genuinely untested line, not a marker
# the bot missed. No preprocessing of excoveralls.json needed
# (verified on #464 against excoveralls 0.18.5).
coverage:
  status:
    project:
      platform:
        flags: [platform]
        threshold: 1% # default 0% fails on any drop, however small
      cli:
        flags: [cli]
        threshold: 1% # default 0% fails on any drop, however small
    patch:
      platform:
        flags: [platform]
        # target auto = patch coverage must be ≥ base commit's coverage
        # (v1's effective behavior — not a 100% gate on new lines).
        # Set target: 100% to hard-require tested new lines.
      cli:
        flags: [cli]
        # target auto, same stance as platform

flags:
  platform:
    paths: [apps/platform/]
    # false: the flag reports only when the platform job ran (path-gated
    # CI) — nothing stale carries into PRs that skip it
    carryforward: false
  cli:
    # The shared api crate is the cli lane's other source tree (its own
    # workspace at repo-root crates/) — its coverage rides this flag
    # too (produced by the second llvm-cov block in the CLI gates job).
    paths: [apps/cli/, crates/]
    # false: the flag reports only when the cli coverage job ran
    # (path-gated CI) — nothing stale carries into PRs that skip it
    carryforward: false

# Generated by `cargo xtask openapi` from the committed OpenAPI
# artifact — reviewed as a diff, never a coverage target (the
# resource_snapshots precedent). NB: TOP-LEVEL, not flag-level —
# flag-scoped ignore is not honored; and the path is the CURRENT
# generation target (#499 moved it out of apps/cli) — without this,
# an API-change PR's +1700 generated lines red patch/cli at 0.00%
# (#506).
ignore:
  - crates/fluxvale-api/src/types.rs

comment:
  layout: reach, diff, flags, files
