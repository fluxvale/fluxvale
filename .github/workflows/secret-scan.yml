# Secret scan (issue #528): gitleaks default rules over the repo,
# baseline allowlist in .gitleaks.toml (every entry justified in
# place), any unallowlisted finding reds the run. Two arms, two
# scopes:
#   * tree-scan - what is checked out now. Runs on every PR (a
#     secret can ride any file type, so no path filter) and nightly
#     on main, so a push that never opened a PR is still caught
#     within a day.
#   * history-sweep - every commit ever merged, weekly. A secret
#     committed then deleted before a nightly still lives in
#     history: only this arm catches that. Dispatchable for triage
#     and first-run validation.
# PRs run tree-scan only - a full-history sweep per PR would be slow
# and mostly duplicative (the PR head is already scanned by the tree
# arm, main's history is what needs sweeping).
# schedule arms fire on the default branch only - main by
# construction, same shape as e2e-nightly. The jobs tell the two
# crons apart via github.event.schedule.
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "53 4 * * *" # nightly tree scan, quiet hour between e2e (02:23) and pentest (07:41)
    - cron: "17 4 * * 0" # weekly history sweep, Sunday, 36 min before the nightly tree scan
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  # false, same stance as the nightlies: runs queue instead of
  # cancelling each other, so the Sunday sweep is never killed by
  # the nightly that follows it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tree-scan:
    name: Tree scan (gitleaks over the checkout)
    # PRs, the nightly cron, and dispatch. The weekly-sweep cron is
    # the one schedule this job skips.
    if: github.event_name != 'schedule' || github.event.schedule == '53 4 * * *'
    runs-on: ubuntu-24.04
    # Image pull plus a ~94 MB tracked-tree scan. 15 is a ceiling,
    # not a target.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CLI facts verified from the v8.30.1 source at the pinned tag
      # (cmd/root.go, cmd/directory.go):
      #   * "dir <path>" scans the working tree - exactly what is
      #     checked out, no git state involved, so a local rerun
      #     matches CI. (The old "detect" command is deprecated
      #     since v8.19.0.)
      #   * --redact is an optional-value flag at this version (bare
      #     use = 100% redaction, NoOptDefVal in cmd/root.go) -
      #     report and logs carry "REDACTED", never the matched
      #     value.
      #   * exit behavior (findingSummaryAndExit): 0 clean, 1 on
      #     leaks OR on a scan error - the gate is fail-closed.
      # The repo is mounted read-only: the scanner only reads
      # source. The report lands in a scratch mount outside /repo so
      # nothing lands in the tree being scanned. The container runs
      # as root (no USER in the image Dockerfile), so no zap-style
      # chmod 0777 is needed on the scratch dir.
      - name: Gitleaks tree scan (unallowlisted finding reds the run)
        run: |
          rm -rf /tmp/gitleaks-wrk && mkdir -p /tmp/gitleaks-wrk
          # Pinned by digest: the v8.30.1 tag resolves to this OCI
          # index today (sha256 verified by hashing the manifest GHCR
          # serves for the tag).
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v /tmp/gitleaks-wrk:/out \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /out/gitleaks-report.json \
              --exit-code 1 \
              --redact

      # always(): a red run's report is the triage evidence, it must
      # not die with the runner (same stance as the zap upload).
      - name: Upload tree-scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-tree-report
          path: /tmp/gitleaks-wrk/gitleaks-report.json

  history-sweep:
    name: History sweep (gitleaks over every commit)
    # Weekly cron and dispatch only - never on PRs (see header).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 0'
    runs-on: ubuntu-24.04
    # Depth-0 checkout plus one git log -p pass (the full history
    # scans in seconds locally - 15 is a generous ceiling).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # fetch-depth 0: the sweep reads every commit, the shallow
      # default would silently cover only the recent slice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same image, config, and flags as tree-scan - only the
      # subcommand differs: "git <path>" walks the full history
      # (cmd/git.go at the pinned tag - without --log-opts it runs
      # git log -p -U0 --full-history --all --diff-filter=tuxdb).
      # The image ships git and pre-sets safe.directory '*' (its
      # Dockerfile), so the read-only /repo mount works as-is and a
      # leaked-then-deleted secret in history still reds the run.
      - name: Gitleaks history sweep (unallowlisted finding reds the run)
        run: |
          rm -rf /tmp/gitleaks-wrk && mkdir -p /tmp/gitleaks-wrk
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v /tmp/gitleaks-wrk:/out \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /out/gitleaks-history-report.json \
              --exit-code 1 \
              --redact

      # always(): same stance as the tree upload - a red sweep's
      # report is the triage evidence.
      - name: Upload history-sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-history-report
          path: /tmp/gitleaks-wrk/gitleaks-history-report.json
