# Platform CI (issue #8). Structure salvaged from v1's platform-ci.yml
# (fluxvale_old) — the proven parts: erlef/setup-beam (precompiled BEAM —
# no OTP source compile), deps/_build caches keyed on the *resolved*
# versions (major-only keys restore binary-incompatible builds after
# runner patch bumps — v1 lesson), Postgres service matching test config.
# v2 differences: BEAM versions are read from mise.toml (single source of
# truth — no drift with local dev), and the gate is one command, `mix ci`,
# exactly what local runs (AGENTS.md: the two must never drift).
# E2E joins from M3 (ADR-0024); dialyzer/coverage when earned.
name: platform

on:
  push:
    branches: [main]
    paths:
      - "apps/platform/**"
      - "mise.toml"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "apps/platform/**"
      - "mise.toml"
      - ".github/workflows/platform.yml"

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_vale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift. NB: runs at repo
      # root — the job's working-directory default is apps/platform.
      - name: Read BEAM versions from mise.toml
        id: beam
        working-directory: .
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          echo "otp=$otp elixir=$elixir"
          test -n "$otp" && test -n "$elixir"
          echo "otp=$otp" >>"$GITHUB_OUTPUT"
          echo "elixir=$elixir" >>"$GITHUB_OUTPUT"

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.beam.outputs.elixir }}
          otp-version: ${{ steps.beam.outputs.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            apps/platform/deps
            apps/platform/_build
          # Key on the *resolved* full versions (setup-beam outputs), not
          # the requested ones, so a runner patch bump busts the cache
          # instead of restoring a binary-incompatible build (v1 lesson)
          key: ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix ci
