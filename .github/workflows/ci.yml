# Monorepo CI (v1 pattern, salvaged): ONE workflow with no path filters,
# a changes job (dorny/paths-filter), per-app jobs gated on its outputs,
# and the umbrella "Wait for CI" job that ALWAYS runs. Branch protection
# requires "Wait for CI" — the only check guaranteed present on every PR,
# so path-skipped apps can never leave a required check pending forever.
# Per-app jobs join here as apps grow (e2e joined at M3; cli: later).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The smoke red path dispatches CI onto the auto-opened revert PR's
  # branch — PRs created with GITHUB_TOKEN fire no pull_request events,
  # so without this the revert would sit check-less behind the required
  # "Wait for CI" forever (docs/deployment.md, #99).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      docs: ${{ steps.filter.outputs.docs }}
      agents: ${{ steps.filter.outputs.agents }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # persist-credentials: false — later steps run no git-authenticated ops
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # v3 — pinned to commit: mutable tags execute unreviewed code
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            platform:
              - "apps/platform/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - "scripts/lint-adr-index.sh"
              - ".github/workflows/ci.yml"
            agents:
              - ".agents/**"
              - "scripts/lint-skill-frontmatter.sh"
              - ".github/workflows/ci.yml"
            e2e:
              - "apps/e2e/**"
              - "apps/platform/**"
              - "deploy/local/**"
              - "scripts/e2e-bootstrap.sh"
              - "Tiltfile" # the bootstrap parses its pins — a bump here is an e2e change
              - "mise.toml"
              - ".github/workflows/ci.yml"

  platform:
    name: Platform CI
    needs: check-changes
    if: needs.check-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_vale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    steps:
      # persist-credentials: false — mix ci runs PR-controlled code; the
      # default persisted token in .git/config would be readable by it
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift. NB: runs at repo
      # root — the job's working-directory default is apps/platform.
      - name: Read BEAM versions from mise.toml
        id: beam
        working-directory: .
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          echo "otp=$otp elixir=$elixir"
          test -n "$otp" && test -n "$elixir"
          echo "otp=$otp" >>"$GITHUB_OUTPUT"
          echo "elixir=$elixir" >>"$GITHUB_OUTPUT"

      # v1 — pinned to commit: the v1 tag is mutable
      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ steps.beam.outputs.elixir }}
          otp-version: ${{ steps.beam.outputs.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            apps/platform/deps
            apps/platform/_build
          # Key on the *resolved* full versions (setup-beam outputs), not
          # the requested ones, so a runner patch bump busts the cache
          # instead of restoring a binary-incompatible build (v1 lesson)
          key: ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Restore dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: apps/platform/priv/plts
          # Same resolved-version keying as the deps cache (v1 lesson: a PLT
          # is a binary tied to the exact OTP patch — stale restore crashes
          # dialyzer with "Old PLT file"). mix ci runs mix dialyzer.
          key: ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix ci

      # v7.1.1 — pinned to commit: mutable tags execute unreviewed code.
      # NB: `uses:` steps run at the workspace root — the job's
      # working-directory default doesn't apply, hence the repo-root path.
      # fail_ci_if_error: v2 has no wait-for-codecov watchdog (v1's
      # signal for silent upload failure) — this is it. A codecov.io
      # outage will red this step; revert to false if that bites.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: platform
          files: apps/platform/cover/excoveralls.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Conventions enforcement (docs/adr/README.md): amended ADRs must be
  # marked in the index — 9 of 14 were unmarked when this landed (#36
  # review fallout). Cheap enough to run on every docs-touching PR.
  docs-lint:
    name: Docs lint
    needs: check-changes
    if: needs.check-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: ./scripts/lint-adr-index.sh

  # Skills frontmatter (Agent Skills spec, as validated by pi and other
  # harnesses): a SKILL.md whose frontmatter doesn't parse is silently
  # unloadable — #52 shipped one through a green pipeline (#53/#54);
  # nothing anywhere validated .agents/**. Cheap: one ruby-stdlib
  # psych parse + spec-shape check per frontmatter-declaring .md.
  skills-lint:
    name: Skills lint
    needs: check-changes
    if: needs.check-changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: ./scripts/lint-skill-frontmatter.sh

  # The M3 E2E suite (#75, ADR-0024 local runtime / ADR-0020 Am. 4):
  # the same scripts/e2e-bootstrap.sh a local re-run uses, driven on an
  # ephemeral runner k3d — one path, no drift. Runtime is dominated by
  # the Forgejo image pull and the minute-granularity reconcile cron
  # (~15 min); a red here means the demo broke, not that the stack
  # rebuilt slowly.
  e2e:
    name: E2E
    needs: check-changes
    if: needs.check-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # mise x must USE the four installed binaries without
      # auto-installing the config's other pins (erlang = source
      # compile, 15+ min — the abandoned CI path in AGENTS.md)
      MISE_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Binaries only (node/k3d/kubectl/helm), verified against
      # mise.lock — the same pins and checksums as local. install:
      # false: a bare `mise install` would also pull erlang (source
      # compile, 15+ min — the abandoned CI path in AGENTS.md); the
      # BEAM stays on setup-beam in the platform job.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          mise-version: 2026.9.14
          install: false
      - run: mise install k3d kubectl helm node

      - name: Bootstrap the local stack
        run: mise x -- scripts/e2e-bootstrap.sh

      - name: Install suite deps + browser
        run: |
          cd apps/e2e
          mise x -- npm ci
          mise x -- npx playwright install --with-deps chromium

      - name: Run the suite
        run: |
          set -a; . apps/e2e/.e2e-env; set +a
          cd apps/e2e
          mise x -- npx playwright test

      # Screenshots/traces land as artifacts (ADR-0024)
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report

  # Deploy pipeline jobs 1–2 (docs/deployment.md, #98) — main pushes with
  # platform changes only. Job 1 builds the OTP release image and pushes
  # two tags of the same manifest: sha-<github.sha> (the /health poll
  # target — BUILD_SHA is baked in as the build-arg) and `latest` (the
  # mutable tag the fleet repo's ImagePolicy follows via
  # digestReflectionPolicy: Always; the digest is what Flux's
  # ImageUpdateAutomation pins into both overlays in one commit). Job 2
  # version-polls both envs' /health until the new SHA is live — the
  # whole chain (DNS → Cloudflare → Traefik → pod) with zero cluster
  # credentials (ADR-0007). Smoke (job 3) lands with #99.
  #
  # Package visibility is public (settlement on #98): source is
  # FSL-public, the image carries no secrets (all config via env) — no
  # imagePullSecrets anywhere.
  deploy-image:
    name: Build and push release image
    # platform, not just check-changes: never ship an image while the CI
    # that vets it is still running — a main-only red (flaky test,
    # codecov outage) must not ride a deploy.
    needs: [check-changes, platform]
    if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # v4.2.2 — pinned to commit: mutable tags execute unreviewed code,
      # and this job holds packages:write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Two asserts, both fixed-string on purpose: Dockerfile and
      # Tiltfile BASE_IMAGE pins must equal each other AND each carry
      # mise.toml's BEAM pins — dev and prod never drift to different
      # toolchains (review finding: prose claimed parity nothing
      # enforced).
      - name: Assert BASE_IMAGE matches Tiltfile + mise.toml pins
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          base="$(sed -n 's/^ARG BASE_IMAGE=\([^ ]*\)$/\1/p' apps/platform/Dockerfile | head -1)"
          tilt="$(sed -n "s/^BASE_IMAGE = '\(.*\)'$/\1/p" Tiltfile | head -1)"
          echo "BASE_IMAGE=$base tilt=$tilt otp=$otp elixir=$elixir"
          test -n "$base" && test -n "$tilt" && test -n "$otp" && test -n "$elixir"
          [ "$base" = "$tilt" ] || { echo "::error::Dockerfile BASE_IMAGE ($base) != Tiltfile BASE_IMAGE ($tilt) — bump the pins together"; exit 1; }
          echo "$base" | grep -qF "$elixir-erlang-$otp" || {
            echo "::error::BASE_IMAGE ($base) does not match mise.toml (elixir $elixir, erlang $otp) — bump the pin alongside mise"; exit 1; }

      # v3.5.0 — pinned to commit: mutable tags execute unreviewed code
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v3.11.1 — pinned to commit (repo rule above)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      # v6.18.0 — pinned to commit (repo rule above). GHA cache: the
      # release build is dominated by deps.compile + app compile; layers
      # cache unless mix.lock or source move.
      - name: Build and push sha-<sha> + latest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/platform
          push: true
          tags: |
            ghcr.io/fluxvale/fluxvale:sha-${{ github.sha }}
            ghcr.io/fluxvale/fluxvale:latest
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy pipeline job 2 (docs/deployment.md): poll BOTH envs until
  # /health reports sha-<github.sha> — prod must not be smoke-tested off
  # the old image (Flux reconciles the envs at different times). The tail
  # posts the Grafana deploy annotation — a deploy fact, deliberately not
  # a smoke verdict (smoke is job 3, #99, which moves this annotation
  # behind itself when it lands; annotation failure still reds the job —
  # observability gaps are loud, never silent).
  watch-deploy:
    name: Watch deploy (staging + prod)
    needs: deploy-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Poll both envs until the new SHA serves
        env:
          SHA: ${{ github.sha }}
        run: |
          expected="sha-$SHA"
          deadline=$((SECONDS + 1200)) # 20 min budget (Flux bump + rollout)
          while (( SECONDS < deadline )); do
            staging="$(curl -fsS --max-time 10 https://staging.fluxvale.com/health | jq -r .version)" || staging=""
            prod="$(curl -fsS --max-time 10 https://fluxvale.com/health | jq -r .version)" || prod=""
            echo "[${SECONDS}s] staging=$staging prod=$prod (want $expected)"
            if [ "$staging" = "$expected" ] && [ "$prod" = "$expected" ]; then
              echo "Both environments serve $expected"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout: both environments did not report $expected within 20 min"
          exit 1

      - name: Grafana deploy annotation
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          SHA: ${{ github.sha }}
        # retry: a transient Grafana 502 must not read as a failed deploy
        run: |
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_SERVICE_ACCOUNT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Deploy fluxvale sha-$SHA rolled out to staging + prod\", \"tags\": [\"deploy\", \"staging\", \"production\", \"fluxvale\"]}"

  # Deploy pipeline job 3 (docs/deployment.md, #99): the post-deploy
  # smoke. staging = Bruno + Playwright sign-in/health (the full
  # lifecycle joins when staging can host instances — Cluster row +
  # wildcard cert, see #99); prod = Bruno + read-only Playwright subset
  # ([ADR-0024](../../docs/adr/00024-e2e-review-environments.md)).
  #
  # Red path per deployment.md: Grafana annotation + auto-opened revert
  # PR of the merged platform PR + PR comment — a human merges
  # ([ADR-0015](../../docs/adr/00015-no-auto-remediation.md)). CI is
  # dispatched onto the revert branch because GITHUB_TOKEN-opened PRs
  # fire no pull_request events (the workflow_dispatch trigger above).
  smoke:
    name: Smoke (staging + prod)
    needs: watch-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Red path only: open the revert PR, comment, and dispatch CI
      # onto its branch (the dispatch needs actions: write — GITHUB_TOKEN
      # is otherwise refused). The smoke legs themselves need no writes.
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # v4.2.2 — pinned to commit like deploy-image: this job holds
      # write scopes (revert PR + dispatch), mutable tags execute
      # unreviewed code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Same pin + install shape as the e2e job: binaries only, node
      # for Bruno + Playwright.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          mise-version: 2026.9.14
          install: false
      - run: mise install node

      - name: Install suites
        run: |
          cd apps/smoke
          mise x -- npm ci
          cd ../e2e
          mise x -- npm ci
          mise x -- npx playwright install --with-deps chromium

      # One env per step, continue-on-error: every leg runs (a prod leg
      # result is triage data during a staging failure), the red path
      # collects outcomes.
      # Config failures must not ride the red path: a missing secret
      # fails HERE with its own message, not as a smoke failure blaming
      # an innocent merged PR (and paging via the dead-man).
      - name: Preflight — secrets
        env:
          SMOKE_PAT_STAGING: ${{ secrets.SMOKE_PAT_STAGING }}
          SMOKE_PAT_PRODUCTION: ${{ secrets.SMOKE_PAT_PRODUCTION }}
        run: |
          test -n "$SMOKE_PAT_STAGING" || { echo "::error::SMOKE_PAT_STAGING is not set — mint per docs/deployment.md"; exit 1; }
          test -n "$SMOKE_PAT_PRODUCTION" || { echo "::error::SMOKE_PAT_PRODUCTION is not set — mint per docs/deployment.md"; exit 1; }

      - name: Bruno — staging
        id: bruno_staging
        working-directory: apps/smoke
        continue-on-error: true
        env:
          SMOKE_PAT: ${{ secrets.SMOKE_PAT_STAGING }}
        run: mise x -- npx bru run --env Staging --env-var pat="$SMOKE_PAT"

      - name: Bruno — production
        id: bruno_production
        working-directory: apps/smoke
        continue-on-error: true
        env:
          SMOKE_PAT: ${{ secrets.SMOKE_PAT_PRODUCTION }}
        run: mise x -- npx bru run --env Production --env-var pat="$SMOKE_PAT"

      # The smoke PAT doubles as the TestInbox token: both are the
      # staging admin's credential (docs/deployment.md oracle split).
      # Own report dir per leg — the default location is shared and
      # the second run would clobber the first's evidence.
      - name: Playwright — staging
        id: pw_staging
        working-directory: apps/e2e
        continue-on-error: true
        env:
          BASE_URL: https://staging.fluxvale.com
          E2E_RUNTIME: staging
          E2E_TESTINBOX_TOKEN: ${{ secrets.SMOKE_PAT_STAGING }}
          PLAYWRIGHT_HTML_REPORT: staging-report
        run: mise x -- npx playwright test

      # Read-only: no PAT, no TestInbox — sign-in on prod would send a
      # real email and provision a user (ADR-0024: no side effects).
      - name: Playwright — production (read-only)
        id: pw_production
        working-directory: apps/e2e
        continue-on-error: true
        env:
          BASE_URL: https://fluxvale.com
          E2E_RUNTIME: production
          PLAYWRIGHT_HTML_REPORT: production-report
        run: mise x -- npx playwright test

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-playwright-reports
          path: |
            apps/e2e/staging-report
            apps/e2e/production-report

      # The red path (docs/deployment.md): annotation, revert PR, PR
      # comment — then fail the run. Every leg is best-effort with its
      # failure logged: one broken leg (a Grafana 502 mid-incident) must
      # not take the others down with it, and the verdict is exit 1
      # regardless.
      - name: Red path — annotation, revert PR, PR comment
        if: ${{ steps.bruno_staging.outcome == 'failure' || steps.bruno_production.outcome == 'failure' || steps.pw_staging.outcome == 'failure' || steps.pw_production.outcome == 'failure' }}
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          failed=""
          [ "${{ steps.bruno_staging.outcome }}" = failure ] && failed="$failed staging(bruno)"
          [ "${{ steps.pw_staging.outcome }}" = failure ] && failed="$failed staging(playwright)"
          [ "${{ steps.bruno_production.outcome }}" = failure ] && failed="$failed production(bruno)"
          [ "${{ steps.pw_production.outcome }}" = failure ] && failed="$failed production(playwright)"
          echo "smoke failed on:$failed"

          annotation_error=""
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_SERVICE_ACCOUNT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Post-deploy smoke FAILED on:$failed — $RUN_URL\", \"tags\": [\"deploy\", \"smoke\", \"failed\"]}" \
            || annotation_error="annotation failed (Grafana unreachable?)"

          # The squash-merge title carries (#N); grep matching nothing
          # must not abort the leg (bash -e + pipefail) — fall through
          # to the latest-merged lookup.
          pr_number="$(printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number' || true)"
          fi
          echo "blaming merged PR #${pr_number:-?}"

          revert_url=""
          if [ -n "$pr_number" ]; then
            revert_body="Automated revert of #$pr_number — post-deploy smoke failed on:$failed.
          Run: $RUN_URL
          A human merges or closes (ADR-0015). CI is dispatched onto this branch so its checks land."
            revert_output="$(gh pr revert "$pr_number" \
              --title "revert: post-deploy smoke failed (#$pr_number)" \
              --body "$revert_body" 2>&1 || true)"
            revert_url="$(printf '%s' "$revert_output" | grep -oE 'https://[^ ]+/pull/[0-9]+' | head -1 || true)"
            # GITHUB_TOKEN cannot push commits touching .github/workflows —
            # a workflow-touching PR cannot be auto-reverted (GitHub
            # refuses App tokens there). The log keeps the reason.
            [ -z "$revert_url" ] && echo "revert PR did not open: $revert_output"
            echo "revert PR: ${revert_url:-none}"

            if [ -n "$revert_url" ]; then
              revert_branch="$(gh pr view "$revert_url" --json headRefName --jq .headRefName || true)"
              if [ -n "$revert_branch" ]; then
                gh workflow run ci.yml --ref "$revert_branch" || echo "CI dispatch failed — the revert PR's checks need a manual run"
              fi
            fi
          fi

          comment_body="Post-deploy smoke failed on:$failed.
          Run: $RUN_URL
          Revert PR: ${revert_url:-FAILED TO OPEN — see the job log}
          ${annotation_error}"
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --body "$comment_body" || echo "PR comment failed"
          else
            echo "no merged PR identified — nothing to comment on"
          fi

          exit 1

  # The umbrella: branch protection requires THIS check. Runs regardless
  # of path gating; passes when every gated job succeeded or was skipped.
  # check-changes must SUCCEED, not merely skip: if it failed, its
  # dependents read "skipped" and the all() below would pass on zero
  # checks run — a green umbrella that proved nothing.
  wait-for-ci:
    name: Wait for CI
    needs: [check-changes, platform, docs-lint, skills-lint, e2e, deploy-image, watch-deploy, smoke]

    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | map("\(.key): \(.value.result)") | .[]' >&2
          echo "$NEEDS" | jq -e '.["check-changes"].result == "success" and (del(.["check-changes"]) | all(.[]; .result == "success" or .result == "skipped"))' >/dev/null \
            && echo "All CI checks passed or were not needed" \
            || { echo "One or more CI jobs failed or were cancelled"; exit 1; }
