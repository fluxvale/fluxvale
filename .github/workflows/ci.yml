# Monorepo CI (v1 pattern, salvaged): ONE workflow with no path filters,
# a changes job (dorny/paths-filter), per-app jobs gated on its outputs,
# and the umbrella "Wait for CI" job that ALWAYS runs. Branch protection
# requires "Wait for CI" — the only check guaranteed present on every PR,
# so path-skipped apps can never leave a required check pending forever.
# Per-app jobs join here as apps grow (e2e: M3; cli: later).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      # persist-credentials: false — later steps run no git-authenticated ops
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # v3 — pinned to commit: mutable tags execute unreviewed code
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            platform:
              - "apps/platform/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"

  platform:
    name: Platform CI
    needs: check-changes
    if: needs.check-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_vale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    steps:
      # persist-credentials: false — mix ci runs PR-controlled code; the
      # default persisted token in .git/config would be readable by it
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift. NB: runs at repo
      # root — the job's working-directory default is apps/platform.
      - name: Read BEAM versions from mise.toml
        id: beam
        working-directory: .
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          echo "otp=$otp elixir=$elixir"
          test -n "$otp" && test -n "$elixir"
          echo "otp=$otp" >>"$GITHUB_OUTPUT"
          echo "elixir=$elixir" >>"$GITHUB_OUTPUT"

      # v1 — pinned to commit: the v1 tag is mutable
      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ steps.beam.outputs.elixir }}
          otp-version: ${{ steps.beam.outputs.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            apps/platform/deps
            apps/platform/_build
          # Key on the *resolved* full versions (setup-beam outputs), not
          # the requested ones, so a runner patch bump busts the cache
          # instead of restoring a binary-incompatible build (v1 lesson)
          key: ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Restore dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: apps/platform/priv/plts
          # Same resolved-version keying as the deps cache (v1 lesson: a PLT
          # is a binary tied to the exact OTP patch — stale restore crashes
          # dialyzer with "Old PLT file"). mix ci runs mix dialyzer.
          key: ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix ci

  # The umbrella: branch protection requires THIS check. Runs regardless
  # of path gating; passes when every gated job succeeded or was skipped.
  wait-for-ci:
    name: Wait for CI
    needs: [platform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | map("\(.key): \(.value.result)") | .[]' >&2
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null \
            && echo "All CI checks passed or were not needed" \
            || { echo "One or more CI jobs failed or were cancelled"; exit 1; }
