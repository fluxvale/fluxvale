# Monorepo CI (v1 pattern, salvaged): ONE workflow with no path filters,
# a changes job (dorny/paths-filter), per-app jobs gated on its outputs,
# and the umbrella "Wait for CI" job that ALWAYS runs. Branch protection
# requires "Wait for CI" — the only check guaranteed present on every PR,
# so path-skipped apps can never leave a required check pending forever.
# Per-app jobs join here as apps grow (e2e joined at M3; cli joined
# with the Rust lane — ADR-0019 Am. 3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      docs: ${{ steps.filter.outputs.docs }}
      agents: ${{ steps.filter.outputs.agents }}
      e2e: ${{ steps.filter.outputs.e2e }}
      cli: ${{ steps.filter.outputs.cli }}
      tfprovider: ${{ steps.filter.outputs.tfprovider }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      # persist-credentials: false — later steps run no git-authenticated ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # v4.0.3 — pinned to commit: mutable tags execute unreviewed code
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            platform:
              - "apps/platform/**"
              # ADR-0044: the content home (docs/public, docs/blog)
              # feeds the platform's loaders, lints, and tests
              # (content.sync copies both into priv before the suite) —
              # a content change is a platform change. The sync script
              # rides the same lanes.
              - "docs/public/**"
              - "docs/blog/**"
              - "scripts/sync-content.sh"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - "scripts/lint-adr-index.sh"
              - ".github/workflows/ci.yml"
            agents:
              - ".agents/**"
              - "scripts/lint-skill-frontmatter.sh"
              - ".github/workflows/ci.yml"
            e2e:
              - "apps/e2e/**"
              - "apps/platform/**"
              - "deploy/local/**"
              - "scripts/e2e-bootstrap.sh"
              - "Tiltfile" # the bootstrap parses its pins — a bump here is an e2e change
              - ".github/workflows/e2e-nightly.yml" # the nightly drives the same bootstrap + suite
              - "mise.toml"
              - ".github/workflows/ci.yml"
            cli:
              - "apps/cli/**"
              # The shared API crate (crates/, its own workspace) — a
              # crate change must compile-check against the CLI here,
              # and run the crate's own gates at the bottom of this job.
              - "crates/**"
              # The generated types are checked against this artifact in
              # cli-gates (`cargo xtask openapi --check`) — a platform PR
              # that regenerates it must run the CLI lane, or the drift
              # reds the next cli PR instead.
              - "apps/platform/priv/open_api.json"
              # The coverage flag's shape (paths/ignore) lives here — a
              # config change must re-run the lane so codecov recomputes
              # against it (#506's generated-lines red).
              - "codecov.yml"
              - ".github/workflows/ci.yml"
              # The release lane drives the same assets (the tag gate
              # script, the 4-leg matrix) — a bump here is a cli change,
              # same rule as e2e-nightly.yml above.
              - ".github/workflows/cli-release.yml"
            tfprovider:
              - "apps/tfprovider/**"
              # The lane parses its Go version from mise.toml — a bump
              # there must run the lane that consumes it.
              - "mise.toml"
              - ".github/workflows/ci.yml"
            mcp:
              - "apps/mcp/**"
              # The shared API crate (crates/, its own workspace) — a
              # crate change must compile-check against the MCP server
              # here, and run the crate's own gates in the same job.
              - "crates/**"
              # The generated types feed the crate from this artifact —
              # a platform PR that regenerates it must run the MCP lane,
              # or the drift reds the next mcp PR instead.
              - "apps/platform/priv/open_api.json"
              # The coverage flag's shape (paths) lives here — a config
              # change must re-run the lane so codecov recomputes
              # against it (#506's generated-lines red).
              - "codecov.yml"
              - ".github/workflows/ci.yml"

  platform:
    name: Platform CI
    needs: check-changes
    if: needs.check-changes.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    # mix ci (~6 min warm, cold deps + dialyzer PLT builds go longer)
    # + the release-mode proof + the codecov upload. 45 is a ceiling,
    # not a target; the default 360 would let a hang sit all night.
    timeout-minutes: 45
    services:
      # (#241, #578 audit) The shared-test-DB flake class cannot arise
      # here today: this is the ONLY platform-test job in any workflow,
      # each GitHub job runs on its own ephemeral runner (service
      # containers are never shared between jobs), this job's two test
      # runs are sequential, and they use distinct DBs (flux_vale_test
      # below; the prod-gate proof pins DATABASE_URL to its own). So no
      # MIX_TEST_PARTITION is wired — it would separate nothing. The
      # standing convention stays for what it actually guards:
      # concurrent LOCAL lanes on one machine. The day this job splits
      # into a parallel matrix, EVERY leg must set MIX_TEST_PARTITION
      # (config/test.exs appends it to the DB name) or the
      # exactly-one-cluster flakes return.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_vale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # (#230/#226) mdex_native compiles here on glibc: point
      # rustler_precompiled at the staged -gnu tarball (.github/actions/
      # prebuilt) instead of its httpc fetch, which dies on the CDN's
      # oversized headers toward runner IPs — surfaced by any cold deps
      # cache (the OTP 29 bump's). Musl rows the action stages are inert
      # here (docker-only consumers).
      RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/apps/platform/.prebuilt-glibc
    defaults:
      run:
        working-directory: apps/platform
    steps:
      # persist-credentials: false — mix ci runs PR-controlled code; the
      # default persisted token in .git/config would be readable by it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift. NB: runs at repo
      # root — the job's working-directory default is apps/platform.
      - name: Read BEAM versions from mise.toml
        id: beam
        working-directory: .
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          echo "otp=$otp elixir=$elixir"
          test -n "$otp" && test -n "$elixir"
          echo "otp=$otp" >>"$GITHUB_OUTPUT"
          echo "elixir=$elixir" >>"$GITHUB_OUTPUT"

      # v1 — pinned to commit: the v1 tag is mutable
      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ steps.beam.outputs.elixir }}
          otp-version: ${{ steps.beam.outputs.otp }}

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/platform/deps
            apps/platform/_build
          # Key on the *resolved* full versions (setup-beam outputs), not
          # the requested ones, so a runner patch bump busts the cache
          # instead of restoring a binary-incompatible build (v1 lesson)
          key: ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Purge the app's cached build (stale protocol consolidation + manifests)
        # A warm _build carries the previous run's protocol-consolidation
        # state for the app — the consolidated beams AND the compiler
        # manifest that recorded them. Any diff that invalidates one
        # Inspect impl (a policy check a resource's DSL references, say)
        # reconsolidates the protocol and recompiles EVERY impl against
        # that stale state, and compile --warnings-as-errors fails the
        # run ("the Inspect protocol has already been consolidated").
        # Measured: purging only the consolidated dir is NOT enough —
        # the manifest alone still fails the compile across a source-tree
        # change, and the beams are stale by the same token — so the
        # app's whole build dir goes. Deps keep their cache; the app
        # recompiles every run (minutes), and consolidation is a
        # regenerable artifact — mix re-consolidates on every
        # compile/test.
        run: rm -rf _build/test/lib/flux_vale

      - name: Restore dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/platform/priv/plts
          # Same resolved-version keying as the deps cache (v1 lesson: a PLT
          # is a binary tied to the exact OTP patch — stale restore crashes
          # dialyzer with "Old PLT file"). mix ci runs mix dialyzer.
          key: ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      # Stages the glibc mdex_native NIF the env var above points at
      # (see the platform job's env comment). mdex-gnu: this job is the
      # only consumer — the docker-image jobs leave the input off.
      - uses: ./.github/actions/prebuilt
        with:
          mdex-gnu: "true"

      - run: mix deps.get

      - run: mix ci

      # #288: the release-mode proof for the admin gate, run as a real
      # leg — the whole point of the mount is that it works under
      # MIX_ENV=prod, and nothing in mix ci compiles that shape. Boots
      # the prod-mode app against a throwaway DB on the same postgres
      # service and runs the env-agnostic gate file (closed 404s + the
      # open arm). The secrets are dummies: signing keys for a run that
      # asserts status codes, never written anywhere.
      - name: Release-mode admin gate proof (MIX_ENV=prod)
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost/flux_vale_prod_gate
          SECRET_KEY_BASE: cicidummysecretcibase64chars-0000000000000000000000000000000000000000
          TOKEN_SIGNING_SECRET: cicidummytokensecret-00000000000000000000000000000000000000000000
          PLATFORM_ENV: local
        run: mix test test/flux_vale_web/admin_gate_test.exs

      # v7.1.1 — pinned to commit: mutable tags execute unreviewed code.
      # NB: `uses:` steps run at the workspace root — the job's
      # working-directory default doesn't apply, hence the repo-root path.
      # fail_ci_if_error: v2 has no wait-for-codecov watchdog (v1's
      # signal for silent upload failure) — this is it. A codecov.io
      # outage will red this step; revert to false if that bites.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: platform
          files: apps/platform/cover/excoveralls.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The Rust CLI lane (ADR-0019 Am. 3): the BEAM disciplines mirrored in
  # Rust — fmt, clippy -D warnings, test, cargo deny (license allowlist,
  # GPL family denied) — path-gated like every other lane. The canary is
  # zero-dep; cargo caches land when real deps do.
  cli-gates:
    name: CLI gates
    needs: check-changes
    if: needs.check-changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    # Gates + coverage in one job; generous ceiling for the
    # instrumented llvm-cov builds on a cold cache.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads apps/cli/rust-toolchain.toml (the exact stable pin) and
      # installs it — toolchain AND the components the file declares.
      # Plain `rustup show` would auto-install the minimal profile and
      # `cargo fmt` would die with "'cargo-fmt' is not installed" —
      # seen on CI (#415); the deprecated auto-install path also warns
      # it may stop working.
      - run: rustup toolchain install

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      # The release-tag gate (#362 T7) proven here on every
      # cli-touching PR — the test-script shape the linked-issues lane
      # uses for its own lint.
      - run: ./scripts/test-check-tag-version.sh

      # The installer (#480): the same shape — the script runs end to
      # end against a fake curl serving fixture archives, no network.
      - run: ./scripts/test-install.sh

      # The release-body composer (#480): changelog section extraction
      # plus the static primer, proven on fixture changelogs and on the
      # real one.
      - run: ./scripts/test-release-notes.sh

      # The installer is user-facing on install day; lint the shell
      # scripts where their tests run (shellcheck is preinstalled on
      # runners).
      - run: shellcheck scripts/*.sh

      # OpenAPI drift guard (ADR-0019 Am. 3): regenerate the typed
      # structs from the committed artifact and diff — the committed
      # spec is the contract, so committed types must match it.
      - run: cargo xtask openapi --check

      # cargo install compiles the tool's dep tree (~5 min); cache the
      # built binary instead — keyed on the exact pin, so a bump
      # re-installs once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2

      - name: Install cargo-deny
        run: "[ -x ~/.cargo/bin/cargo-deny ] || cargo install --locked cargo-deny@0.20.2"

      - run: cargo deny check licenses advisories

      # The shared API crate (crates/) is its own workspace — the third
      # Rust tree (apps/cli, crates), independently resolved from
      # apps/cli and never linked to it. Same gate set, run from its
      # own root: a crates/** change fires this lane (the filter) and
      # these steps prove the crate green in its own tree. The
      # toolchain (same 1.99.1 pin — crates/rust-toolchain.toml is
      # paired with apps/cli's) and cargo-deny are already installed
      # by the steps above.
      - run: cargo fmt --all -- --check
        working-directory: crates

      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates

      - run: cargo test --workspace
        working-directory: crates

      - run: cargo deny check
        working-directory: crates

      # Coverage rides THIS job (was its own cli-coverage job until
      # #510): one fewer runner start + queue slot per cli-touching
      # PR — the separate job once sat QUEUED 3h19m on run 42213018762
      # (every other job done by 12:07, "CLI coverage" started
      # 15:08:33) while "Wait for CI" held the PR. timeout-minutes
      # can't cap queue time, fewer jobs can. llvm-cov runs after the
      # gates so gate failures surface fast.
      #
      # llvm-tools-preview is the component cargo-llvm-cov drives
      # (the minimal default profile omits it; the toolchain files
      # declare only rustfmt and clippy).
      - run: rustup component add llvm-tools-preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1

      - name: Install cargo-llvm-cov
        run: "[ -x ~/.cargo/bin/cargo-llvm-cov ] || cargo install --locked cargo-llvm-cov@0.9.1"

      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # NB: uses: steps run at the workspace root — repo-root path.
      # fail_ci_if_error: same watchdog the platform upload carries —
      # a codecov.io outage reds the lane (v2 has no upload
      # acknowledgement beyond this).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: cli
          files: apps/cli/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # The shared API crate's coverage (crates/, its own workspace)
      # rides the same `cli` flag — a second report from its own root,
      # so the flag's crates/ paths (codecov.yml) have a producer.
      # Same toolchain pin (paired with apps/cli's), same installed
      # cargo-llvm-cov.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        working-directory: crates

      # NB: uses: steps run at the workspace root — repo-root path.
      - name: Upload crate coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: cli
          files: crates/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The 4-target distribution matrix (ADR-0019 Am. 3): release builds,
  # one binary artifact per target as the per-PR proof. All four legs
  # are NATIVE runners — linux aarch64 rides the ubuntu-24.04-arm label
  # (free for public repos, no cross toolchain), macos-latest is arm64
  # (M1), windows-latest is x64.
  cli-matrix:
    name: CLI matrix (${{ matrix.leg.name }})
    needs: check-changes
    if: needs.check-changes.outputs.cli == 'true'
    runs-on: ${{ matrix.leg.os }}
    # Compiler builds on four OSes; observed ~3 min but a hung build
    # should cancel, not sit out the 360-minute default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: linux-amd64
            os: ubuntu-24.04
            binary: target/release/fluxvale
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            binary: target/release/fluxvale
          - name: macos-aarch64
            os: macos-latest
            binary: target/release/fluxvale
          - name: windows-x86_64
            os: windows-latest
            binary: target/release/fluxvale.exe
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install

      - run: cargo build --release

      # NB: uses: steps run at the workspace root — repo-root path.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluxvale-${{ matrix.leg.name }}
          path: apps/cli/${{ matrix.leg.binary }}

  # The MCP server lane (slice W2a of #484): the CLI lane's Rust
  # disciplines — fmt, clippy -D warnings, test, cargo deny — over the
  # apps/mcp workspace, plus the shared crates/ tree it consumes (the
  # same pair of trees the CLI compiles against). Coverage rides THIS
  # job (the #510 shape) with flag `mcp`. No release matrix: the server
  # ships as a container image in W3, not distributed binaries.
  mcp-gates:
    name: MCP gates
    needs: check-changes
    if: needs.check-changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    # Gates + coverage in one job; generous ceiling for the
    # instrumented llvm-cov builds on a cold cache.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads apps/mcp/rust-toolchain.toml (the exact stable
      # pin, paired with apps/cli's and crates/') and installs it —
      # toolchain AND the components the file declares (see the
      # cli-gates comment for the #415 minimal-profile lesson).
      - run: rustup toolchain install

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Same cargo-deny cache + pin as cli-gates — both lanes check
      # their own workspace's deny.toml (kept in sync with apps/cli's).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2

      - name: Install cargo-deny
        run: "[ -x ~/.cargo/bin/cargo-deny ] || cargo install --locked cargo-deny@0.20.2"

      - run: cargo deny check licenses advisories

      # crates/ is its own workspace — the same gate set cli-gates runs
      # there. A crates/** change fires BOTH lanes (both filters list
      # crates/**), so the crate is proven green against the MCP
      # server's resolution too.
      - run: cargo fmt --all -- --check
        working-directory: crates

      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates

      - run: cargo test --workspace
        working-directory: crates

      - run: cargo deny check
        working-directory: crates

      # Coverage folded into the gates job (#510's shape — one fewer
      # queued job per lane run; llvm-cov runs after the gates so gate
      # failures surface fast). llvm-tools-preview is the component
      # cargo-llvm-cov drives (the minimal default profile omits it).
      - run: rustup component add llvm-tools-preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1

      - name: Install cargo-llvm-cov
        run: "[ -x ~/.cargo/bin/cargo-llvm-cov ] || cargo install --locked cargo-llvm-cov@0.9.1"

      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # NB: uses: steps run at the workspace root — repo-root path.
      # fail_ci_if_error: the codecov.io outage watchdog every upload
      # in this workflow carries.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: mcp
          files: apps/mcp/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # crates/ coverage rides the `cli` flag (codecov.yml paths) and
      # already has a producer in cli-gates — a crates/** change fires
      # both lanes, so no second report here.

  # The Terraform/OpenTofu provider lane (ADR-0019 Am. 4): gofmt + vet
  # + test + build, path-gated like every other lane. Go is parsed from
  # mise.toml — the single source of truth, same as the BEAM lane's
  # parse step.
  tfprovider:
    name: Terraform provider CI
    needs: check-changes
    if: needs.check-changes.outputs.tfprovider == 'true'
    runs-on: ubuntu-24.04
    # The gates + the real-tofu smoke (a real OpenTofu CLI driving the
    # real compiled binary: plan, apply, destroy — ~1 min with the
    # toolchain download; the 10s of the gateway-observe poll inside).
    # 25 is a ceiling, not a target.
    timeout-minutes: 25
    env:
      # mise x must USE the installed tofu without auto-installing the
      # config's other pins (erlang = source compile, 15+ min — the
      # abandoned CI path in AGENTS.md)
      MISE_AUTO_INSTALL: "0"
    defaults:
      run:
        working-directory: apps/tfprovider
    steps:
      # persist-credentials: false — later steps run no git-authenticated ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift. NB: runs at repo
      # root — the job's working-directory default is apps/tfprovider.
      - name: Read Go version from mise.toml
        id: go
        working-directory: .
        run: |
          version="$(sed -n 's/^go *= *"\([^"]*\)".*/\1/p' mise.toml)"
          echo "go=$version"
          test -n "$version"
          echo "go=$version" >>"$GITHUB_OUTPUT"

      # v7.0.0 — pinned to commit: mutable tags execute unreviewed code.
      # cache-dependency-path: no root go.sum exists, and without this
      # input setup-go looks for one at the workspace root, fails, and
      # downgrades to a WARNING — the module cache silently never
      # saves, every run a cold full-tree download.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.go }}
          cache-dependency-path: apps/tfprovider/go.sum

      # Fails on any output: the files gofmt would rewrite.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "$out"; exit 1; }

      - run: go vet ./...

      - run: go test ./...

      - run: go build ./...

      # The release-tag gate (#482 P7) proven here on every
      # provider-touching PR — the same shape the cli lane runs for
      # its script (the test-script shape the linked-issues lane uses).
      - run: ./scripts/test-check-tag-version.sh

      - run: shellcheck scripts/*.sh

      # The real-tofu smoke (TFPROVIDER_E2E=1 below): a real OpenTofu
      # CLI driving the real compiled binary — the gate that catches
      # what in-process tests cannot (it caught the reserved-`provider`
      # root attribute and the plan-time-unknown organization seed on
      # its first runs). Same pins + install shape as the e2e job:
      # binaries verified against mise.lock; install the ONE tool this
      # job needs, never the whole config.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install: false
      - run: mise install opentofu

      # Examples are user-facing copy-paste: formatting is part of the
      # contract. Offline — no provider install, just the formatter.
      - name: tofu fmt (examples)
        run: mise x -- tofu fmt -check -recursive examples

      # Offline (the fake is an httptest server; dev_overrides needs no
      # registry): plan → apply → destroy against the freshly built
      # binary. See internal/provider/e2e_test.go for what this gate is
      # for.
      - name: Real-tofu smoke
        env:
          TFPROVIDER_E2E: "1"
        run: mise x -- go test ./internal/provider -run TestRealTofuSmoke -count=1 -v

  # Conventions enforcement (docs/adr/README.md): amended ADRs must be
  # marked in the index — 9 of 14 were unmarked when this landed (#36
  # review fallout). Cheap enough to run on every docs-touching PR.
  docs-lint:
    name: Docs lint
    needs: check-changes
    if: needs.check-changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: ./scripts/lint-adr-index.sh

  # Skills frontmatter (Agent Skills spec, as validated by pi and other
  # harnesses): a SKILL.md whose frontmatter doesn't parse is silently
  # unloadable — #52 shipped one through a green pipeline (#53/#54);
  # nothing anywhere validated .agents/**. Cheap: one ruby-stdlib
  # psych parse + spec-shape check per frontmatter-declaring .md.
  skills-lint:
    name: Skills lint
    needs: check-changes
    if: needs.check-changes.outputs.agents == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: ./scripts/lint-skill-frontmatter.sh

  # Linked issues (umbrella close): a body that closes an issue while
  # calling itself an incomplete slice — `Closes #N (slice 1 of 4)` —
  # closes that issue on merge, before the other slices exist. #62 did it
  # to #61 (reopened 15s later) and #269 did it to #268 (closed with three
  # of six scope items unbuilt, #273). Both passed a green pipeline:
  # nothing read the body. NOT path-filtered, deliberately — every lint
  # above keys on files, but this class can fire on any PR, and the two
  # incidents being docs PRs was luck, not a property of the class. The
  # job is a bash regex over an event payload, so it costs a runner start
  # and seconds, on every PR. `if: pull_request` because the body only
  # exists there (push/workflow_dispatch have no PR to check). Body EDITS
  # are handled by linked-issues-edited.yml, not by widening this
  # workflow's triggers — that would re-run the E2E legs on every body
  # edit, and CodeRabbit edits every body.
  linked-issues:
    name: Linked issues
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The body comes from the event payload — no token, no API call, and
      # the same script a local run uses.
      - name: Lint PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | ./scripts/lint-linked-issues.sh

      # The guard is proven on every PR that touches it, not just when a
      # body happens to trip it (fixtures are the real #62/#269 bodies).
      - name: Test the lint
        run: ./scripts/test-lint-linked-issues.sh

  # The M3 E2E suite (#75, ADR-0024 local runtime / ADR-0020 Am. 4):
  # the same scripts/e2e-bootstrap.sh a local re-run uses, driven on an
  # ephemeral runner k3d — one path, no drift. Sharded by file (#210):
  # the suite is serial by design (one app under test), so legs split
  # the FILES, each leg on its own stack. Lifecycle holds the
  # instance-deploying specs (cold Forgejo/Kavita/Vaultwarden pulls
  # dominate); timers the platform-timer-bound specs (scale-to-zero on the
  # compressed every-minute cadence + the leg-scoped 45s threshold —
  # #210 part 3; the nightly full-cadence workflow holds the real
  # pair); pages the rest. Legs stay independent, never sharing
  # state.
  e2e:
    # Matrix check names default to every matrix value — pin the leg
    # name so checks read "E2E (pages)" and not the whole spec list
    name: E2E (${{ matrix.leg.name }})
    needs: check-changes
    if: needs.check-changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # (#578) 60, not 45: the ceiling must sit above the SUM of bounded
    # work or it cancels legitimate runs mid-suite. Old worst observed
    # leg ≈ 28.5m (timers, both attempts pull-bound) under a 45
    # ceiling (16.5m slack); the warm-up (+≤8m budget) and the
    # bootstrap's one bounded retry (+≤12m worst: attempt 1 dies ~12m
    # in at the rollout wait, then the idempotent re-run rebuilds a
    # fresh cached tag and re-waits up to 600s) push the legitimate
    # worst to ≈ 48.5m — 60 leaves ~11.5m hang slack. Tighter than the
    # old slack on purpose: the new worst already carries congestion
    # padding the old one didn't. The waits themselves are unchanged.
    timeout-minutes: 60
    strategy:
      # A red leg must not cancel the others — its report is triage
      # data (legs stay independent, never sharing state)
      fail-fast: false
      matrix:
        leg:
          # warm_apps (#578): the catalog slugs this leg's specs deploy —
          # the warm-up step pre-pulls their images before the suite.
          # Empty on pages: its specs deploy nothing.
          - name: pages
            specs: tests/health.spec.ts tests/landing.spec.ts tests/org-pages.spec.ts tests/policies.spec.ts tests/public-pages.spec.ts tests/root-session.spec.ts tests/sign-in.spec.ts tests/switcher-dismiss.spec.ts
            warm_apps: ""
          - name: lifecycle
            # pocket-id joined here in #510's pass — it had shipped
            # (#492's catalog PRs) without joining a leg, so PR CI
            # never ran it (only the nightly full-cadence workflow
            # does now; the per-merge post-deploy smoke retired with
            # #556. apps/e2e/README.md warns exactly about this gap).
            specs: tests/forgejo-lifecycle.spec.ts tests/actual-lifecycle.spec.ts tests/vaultwarden-lifecycle.spec.ts tests/memos-lifecycle.spec.ts tests/pocket-id-lifecycle.spec.ts tests/file-access.spec.ts tests/backups.spec.ts
            warm_apps: forgejo actualbudget vaultwarden memos pocket-id kavita
          # #210 part 3: threshold 45s + probe window 150s are safe
          # HERE only — this leg's instance gets no traffic, so the
          # 30s beacon staleness that guards the other legs' 180s
          # default can't cause a false idle (scripts/e2e-bootstrap.sh
          # carries the reasoning)
          - name: timers
            specs: tests/scale-to-zero.spec.ts
            idle_sleep_seconds: "45"
            probe_window_ms: "150000"
            warm_apps: forgejo
    env:
      # mise x must USE the four installed binaries without
      # auto-installing the config's other pins (erlang = source
      # compile, 15+ min — the abandoned CI path in AGENTS.md)
      MISE_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Binaries only (node/k3d/kubectl/helm/rclone), verified against
      # mise.lock — the same pins and checksums as local. install:
      # false: a bare `mise install` would also pull erlang (source
      # compile, 15+ min — the abandoned CI path in AGENTS.md); the
      # BEAM stays on setup-beam in the platform job. rclone joined with
      # #190: the file-access E2E's client.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install: false
      - run: mise install k3d kubectl helm node rclone

      # v4.4.1 — pinned to commit (repo rule above). The bootstrap's
      # manual buildx build needs a buildkit builder for the gha layer
      # cache (#210). build-push-action wires a builder internally for
      # the release job; a run:-step buildx call does not get one
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # v4.0.0 — pinned to commit (repo rule above). Exposes
      # ACTIONS_RUNTIME_TOKEN/URL to run: steps — the runner injects
      # them only into uses: steps, and without them buildx SILENTLY
      # drops the type=gha cache config (no error, no cache)
      - name: Expose GitHub runtime for the gha cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487

      # (#230) Pre-seed the pre-built artifacts (tailwind binary +
      # mdex_native NIF) so the dev-image build's `mix deps.compile`
      # and `mix assets.setup` never fetch in-image (Erlang httpc's
      # 10KB header limit dies on the release CDN's oversized response
      # headers). The shared action is the one implementation; see
      # .github/actions/prebuilt.
      - uses: ./.github/actions/prebuilt

      # Matrix-sourced env on BOTH steps that read it: the bootstrap
      # (E2E_IDLE_SLEEP_AFTER_SECONDS — the override must be on the
      # stack the spec then runs against, not just the spec's own
      # process) and the suite step (E2E_PROBE_WINDOW_MS). Empty on
      # the other legs — the bootstrap's :-180 default and the spec's
      # built-in default then apply.
      - name: Bootstrap the local stack
        env:
          E2E_IDLE_SLEEP_AFTER_SECONDS: ${{ matrix.leg.idle_sleep_seconds }}
        # (#578) One bounded retry, the apply_with_retry stance: the
        # script is idempotent by design (cluster/charts/manifests
        # updated in place), and the banked red class is a TRANSIENT
        # rollout-wait timeout under runner-wide registry congestion —
        # runs 42346721386/42346929756/42348696195, all three legs'
        # bootstraps dead in the same half-hour window at `rollout
        # status --timeout=600s` ("timed out waiting for the
        # condition"). A second attempt rides the congestion out; two
        # failures is a real bootstrap bug, and it reds loudly — no
        # third attempt to sleep it off.
        run: |
          attempts=0
          until mise x -- scripts/e2e-bootstrap.sh; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 2 ]; then
              echo "::error::bootstrap failed twice — the second attempt's error stands above (a real bug, not congestion)"
              exit 1
            fi
            echo "bootstrap-retry: attempt 1 failed — retrying in 10s (idempotent re-run; the marker keeps the flake rate measurable)"
            if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
              echo "::warning::bootstrap-retry: attempt 1 failed — retrying (transient rollout-wait timeout class, #578)"
            fi
            sleep 10
          done

      # (#578) Warm the leg's catalog images onto the k3d node BEFORE
      # the suite. The banked timeout class: the specs' deploy-walk
      # waits were being spent on cold registry pulls under congestion
      # — run 42324879960 (timers leg) died at exactly 720000ms twice
      # ("status never reached Running"), the pull owning the clock
      # instead of the platform. App images are version-tagged and the
      # pod specs set no imagePullPolicy, so kubelet resolves them
      # IfNotPresent: a node that already carries the image makes the
      # deploy walk measure the platform. k3d v5 has no `image pull`
      # — the documented path is host `docker pull` + `k3d image
      # import -m direct` (direct streams the local tarball into the
      # node's containerd; the default tools-node mode would itself
      # pull k3d-tools from Docker Hub — the congestion class again).
      # Refs come from the sources of truth, keyed by slug (catalog)
      # and by config (the file-access sidecar — not catalog data):
      # the bootstrap's parse-don't-fork stance for Tiltfile pins.
      # Pulls are best-effort under a TOTAL budget — congestion (the
      # timeout exit, 124) warns and the suite keeps its own budgets;
      # the leg's fate stays with the suite. A ref that fails TWICE
      # outright, though, is a repo bug: red here, loudly, not as a
      # cryptic ImagePullBackOff 15 minutes in.
      - name: Warm the leg's catalog images onto the node
        env:
          LEG_WARM_APPS: ${{ matrix.leg.warm_apps }}
        run: |
          if [ -z "$LEG_WARM_APPS" ]; then
            echo "warm-up: this leg deploys no catalog apps — nothing to warm"
            exit 0
          fi
          catalog=apps/platform/priv/repo/seeds/catalog_data.yaml
          config=apps/platform/config/config.exs
          deadline=$((SECONDS + 480)) # 8 min TOTAL: several warm pulls + slack for one slow one
          refs=""
          for app in $LEG_WARM_APPS; do
            app_refs="$(
              awk -v app="$app" '
                $1 == "slug:" { hit = ($2 == app) }
                hit && $1 == "image:" { print $2 }
              ' "$catalog"
            )"
            if [ -z "$app_refs" ]; then
              echo "::error::$app has no image: line in $catalog — did the seed YAML change shape?"
              exit 1
            fi
            refs="$refs $app_refs"
          done
          # The file-access sidecar rides any file-access instance
          # (file-access.spec runs on the lifecycle leg); its pin
          # lives in config.exs, not the catalog — parse that too.
          sidecar="$(sed -n 's/^ *image: "\(rclone\/rclone:[^"]*\)".*/\1/p' "$config" | head -1)"
          if [ -z "$sidecar" ]; then
            echo "::error::no rclone/rclone image pin found in $config — did the file_access config change shape?"
            exit 1
          fi
          refs="$refs $sidecar"
          # 0 = pulled, 1 = budget-exhausted (timeout's 124), 2 = outright
          pull_one() {
            if timeout "$1" docker pull -q "$2"; then return 0; fi
            [ "$?" -eq 124 ] && return 1
            return 2
          }
          for ref in $refs; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::warm-up budget spent before $ref — image stays cold; the suite's own deploy budget applies"
              exit 0
            fi
            echo "warm-up: pulling $ref ($((deadline - SECONDS))s of budget left)"
            rc=0; pull_one "$((deadline - SECONDS))" "$ref" || rc=$?
            if [ "$rc" -eq 2 ]; then
              # outright failure: one immediate retry — a transient
              # blip passes, a broken ref fails twice and reds
              rc=0; pull_one "$((deadline - SECONDS))" "$ref" || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "::warning::warm-up: $ref failed once outright, succeeded on the immediate retry — transient?"
              fi
            fi
            case "$rc" in
              0) ;;
              1) echo "::warning::warm-up: $ref did not finish in budget — image stays cold; the suite's own deploy budget applies"; continue ;;
              *) echo "::error::warm-up: $ref is not pullable (failed twice outright) — a broken ref in the catalog/config, not congestion"; exit 1 ;;
            esac
            # local tar streaming (direct mode), no network — a 120s
            # hang guard only; a failure warns, never reds the leg
            if ! timeout 120 mise x -- k3d image import -m direct -c fluxvale "$ref" >/dev/null; then
              echo "::warning::warm-up: import of $ref failed — image stays cold; the suite's own deploy budget applies"
            fi
          done
          echo "warm-up: done — node carries:$refs"

      # #210: npm ci + playwright install re-downloaded everything
      # every run — and stalled 12m once (runner/network variance).
      # The lockfile pins @playwright/test — and so the browser build
      # — exactly; its hash covers both. Exact key only: a bump
      # re-downloads once instead of restoring a stale browser set.
      # The --with-deps apt libraries still install per run — seconds,
      # not the stall class.
      - name: Restore npm + Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-npm-pw-${{ hashFiles('apps/e2e/package-lock.json') }}

      # #210 slice C: the chronic deps stall. `playwright install
      # --with-deps` downloads ~26 MB of system debs (fonts-liberation,
      # fonts-unifont, fonts-wqy-zenhei, libgbm1 — none preinstalled on
      # the runner) whose mirror throughput swings from MB/s to
      # ~69 kB/s: 3 of 4 recent runs stalled 6-7m. Cache the debs
      # themselves, keyed on the lockfile (it pins @playwright/test,
      # which pins the dep manifest); a bump repopulates once. Exact
      # key only. Warming SEEDS apt's own archive dir — version
      # resolution stays apt's (a stale deb is ignored and re-fetched,
      # never force-installed: a dpkg -i warm loop would silently
      # downgrade and break strictly-pinned dependents).
      - name: Restore Playwright apt cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pw-apt
          key: ${{ runner.os }}-pw-apt-${{ hashFiles('apps/e2e/package-lock.json') }}

      - name: Install suite deps + browser
        run: |
          cd apps/e2e
          mise x -- npm ci
          # Seed apt's download dir from the cache (sudo — the dir is
          # root's). Filename-versioned debs never collide; apt then
          # installs its candidates straight from the local dir —
          # zero deb downloads — and quietly re-fetches anything whose
          # candidate moved (runner-image drift degrades the hit rate,
          # never correctness).
          if compgen -G "$HOME"/.pw-apt/*.deb >/dev/null; then
            staged=$(ls "$HOME"/.pw-apt/*.deb | wc -l)
            sudo cp "$HOME"/.pw-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            echo "pw apt cache: seeded $staged debs (apt resolves versions; the index fetch still runs)"
          else
            echo "pw apt cache: cold — playwright's apt pass downloads the set once"
          fi
          mise x -- npx playwright install --with-deps chromium
          # Persist apt's fetched debs for the next run. First write
          # wins per key (legs race on cold; identical content), and
          # the entries rotate with the lockfile.
          mkdir -p "$HOME/.pw-apt"
          sudo cp -n /var/cache/apt/archives/*.deb "$HOME/.pw-apt/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.pw-apt"
          echo "pw apt cache: $(ls "$HOME"/.pw-apt/*.deb | wc -l) debs staged for save"

      # Env-indirected, not ${{ }}-inline: specs are repo-controlled,
      # but the env seam keeps the run: block free of template
      # injection. E2E_PROBE_WINDOW_MS is the spec-side half of the
      # timers leg's knobs (the threshold half rides the bootstrap
      # step above)
      - name: Run the suite
        env:
          LEG_SPECS: ${{ matrix.leg.specs }}
          E2E_PROBE_WINDOW_MS: ${{ matrix.leg.probe_window_ms }}
          # The bootstrap guarantees the metrics tree on these legs —
          # a missing wake SLI is a bootstrap bug, fail it loudly
          # (local runs keep the lenient fallback instead).
          E2E_REQUIRE_WAKE_SLI: "1"
        run: |
          set -a; . apps/e2e/.e2e-env; set +a
          cd apps/e2e
          mise x -- npx playwright test $LEG_SPECS

      # Screenshots/traces land as artifacts (ADR-0024); one report
      # per leg — a shared name would collide across matrix legs
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.leg.name }}
          path: apps/e2e/playwright-report

      # The platform pod's log is the only place a failed deploy's raw
      # error lives (the page and trace carry only status_message's
      # friendly copy — the 888195a lifecycle-leg red lost its evidence
      # exactly there). Dump it before the runner dies; failure-only,
      # one artifact per leg.
      - name: Upload platform log (failure evidence)
        if: failure()
        run: |
          # stderr too: a deployment with no available pod fails kubectl logs,
          # and the reason is then the only evidence there is
          mise x -- kubectl -n fluxvale-dev logs deployment/fluxvale-platform --tail=5000 \
            > platform-log-${{ matrix.leg.name }}.txt 2>&1 || true
      - name: Upload platform log artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-log-${{ matrix.leg.name }}
          path: platform-log-${{ matrix.leg.name }}.txt

  # Deploy pipeline jobs 1–2 (docs/deployment.md, #98) — main pushes with
  # platform changes only. Job 1 builds the OTP release image and pushes
  # two tags of the same manifest: sha-<github.sha> (the /health poll
  # target — BUILD_SHA is baked in as the build-arg) and `latest` (the
  # mutable tag the fleet repo's ImagePolicy follows via
  # digestReflectionPolicy: Always; the digest is what Flux's
  # ImageUpdateAutomation pins into both overlays in one commit). Job 2
  # version-polls both envs' /health until the new SHA is live — the
  # whole chain (DNS → Cloudflare → Traefik → pod) with zero cluster
  # credentials (ADR-0007). Job 3 (the readiness gate, #556) follows.
  #
  # Package visibility is public (settlement on #98): source is
  # FSL-public, the image carries no secrets (all config via env) — no
  # imagePullSecrets anywhere.
  deploy-image:
    name: Build and push release image
    # platform, not just check-changes: never ship an image while the CI
    # that vets it is still running — a main-only red (flaky test,
    # codecov outage) must not ride a deploy.
    needs: [check-changes, platform]
    if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # v7.0.1 — pinned to commit: mutable tags execute unreviewed code,
      # and this job holds packages:write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Two asserts, both fixed-string on purpose: Dockerfile and
      # Tiltfile BASE_IMAGE pins must equal each other AND each carry
      # mise.toml's BEAM pins — dev and prod never drift to different
      # toolchains (review finding: prose claimed parity nothing
      # enforced).
      - name: Assert BASE_IMAGE matches Tiltfile + mise.toml pins
        run: |
          otp="$(sed -n 's/^erlang *= *"\([^"]*\)".*/\1/p' mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\([^"]*\)".*/\1/p' mise.toml | sed 's/-otp-.*//')"
          base="$(sed -n 's/^ARG BASE_IMAGE=\([^ ]*\)$/\1/p' apps/platform/Dockerfile | head -1)"
          tilt="$(sed -n "s/^BASE_IMAGE = '\(.*\)'$/\1/p" Tiltfile | head -1)"
          echo "BASE_IMAGE=$base tilt=$tilt otp=$otp elixir=$elixir"
          test -n "$base" && test -n "$tilt" && test -n "$otp" && test -n "$elixir"
          [ "$base" = "$tilt" ] || { echo "::error::Dockerfile BASE_IMAGE ($base) != Tiltfile BASE_IMAGE ($tilt) — bump the pins together"; exit 1; }
          echo "$base" | grep -qF "$elixir-erlang-$otp" || {
            echo "::error::BASE_IMAGE ($base) does not match mise.toml (elixir $elixir, erlang $otp) — bump the pin alongside mise"; exit 1; }

      # v4.6.0 — pinned to commit: mutable tags execute unreviewed code
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v4.4.1 — pinned to commit (repo rule above)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # (#230) The release build's `mix assets.deploy` auto-fetches
      # tailwind when the binary is missing (mix tailwind installs on
      # demand) — same httpc header limit, same CDN, and this job runs
      # on every main push. Pre-seed the same staged artifacts the e2e
      # legs use; Dockerfile COPYs them where deps.compile and
      # install_and_run's existence checks look. Local release builds:
      # .prebuilt/ holds only .gitkeep, default fetch paths unchanged.
      - uses: ./.github/actions/prebuilt

      # ADR-0044 §2: the priv content copies are gitignored and the
      # build context is apps/platform — stage docs/public and docs/blog
      # into it before the image build, the same channel the e2e
      # bootstrap and Tiltfile use. Without it the image ships an empty
      # /docs and /blog.
      - name: Sync content into the build context
        run: scripts/sync-content.sh

      # v7.4.0 — pinned to commit (repo rule above). GHA cache: the
      # release build is dominated by deps.compile + app compile; layers
      # cache unless mix.lock or source move.
      - name: Build and push sha-<sha> + latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: apps/platform
          push: true
          tags: |
            ghcr.io/fluxvale/fluxvale:sha-${{ github.sha }}
            ghcr.io/fluxvale/fluxvale:latest
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy pipeline job 2 (docs/deployment.md): poll BOTH envs until
  # /health reports sha-<github.sha> — prod must not be readiness-gated
  # off the old image (Flux reconciles the envs at different times). The
  # tail posts the Grafana deploy annotation — a deploy fact, not a
  # behavioral verdict (the readiness gate follows this job; annotation
  # failure still reds the job — observability gaps are loud, never
  # silent).
  watch-deploy:
    name: Watch deploy (staging + prod)
    needs: deploy-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Poll both envs until the new SHA serves
        env:
          SHA: ${{ github.sha }}
        run: |
          expected="sha-$SHA"
          deadline=$((SECONDS + 1200)) # 20 min budget (Flux bump + rollout)
          while (( SECONDS < deadline )); do
            staging="$(curl -fsS --max-time 10 https://staging.fluxvale.com/health | jq -r .version)" || staging=""
            prod="$(curl -fsS --max-time 10 https://fluxvale.com/health | jq -r .version)" || prod=""
            echo "[${SECONDS}s] staging=$staging prod=$prod (want $expected)"
            if [ "$staging" = "$expected" ] && [ "$prod" = "$expected" ]; then
              echo "Both environments serve $expected"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout: both environments did not report $expected within 20 min"
          exit 1

      - name: Grafana deploy annotation
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          SHA: ${{ github.sha }}
        # retry: a transient Grafana 502 must not read as a failed deploy
        run: |
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_SERVICE_ACCOUNT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Deploy fluxvale sha-$SHA rolled out to staging + prod\", \"tags\": [\"deploy\", \"staging\", \"production\", \"fluxvale\"]}"

  # Deploy pipeline job 3 (docs/deployment.md, #99, reshaped by #556):
  # the readiness gate. The behavioral smoke (Bruno + Playwright) left
  # per-merge CI (#556: five flake-class auto-reverts in one day, every
  # failed sha green on a later run, deploy-roll races all). The
  # scheduled smoke (smoke.yml, 30-min cadence, does not gate) is the
  # primary regression net. What gates a merge here is deterministic
  # only: both envs must serve THIS merge's sha with HTTP 200 inside a
  # bounded window. A timeout means the new version never came up (an
  # unbootable deploy) and reds the run for a human to revert
  # (ADR-0015). No auto-revert machinery anymore: there is nothing
  # behavioral left to blame, and the false-revert class is gone
  # structurally. No checkout, no toolchain: curl + jq only.
  readiness-gate:
    name: Readiness gate (staging + prod)
    needs: watch-deploy
    runs-on: ubuntu-24.04
    # watch-deploy already waited up to 20 min for both envs to serve
    # the sha; the gate re-asserts it (the version pin is the gate's
    # core, #556) with a short bounded window for the tail. A timeout
    # here is a red, never a flake-retry: a version that will not serve
    # will not serve. Timeout posts the Grafana failure annotation (the
    # same route the retired smoke red path used — observability gaps
    # are loud, never silent), then fails the run.
    timeout-minutes: 15
    steps:
      - name: Assert both envs serve the merge sha with 200
        env:
          SHA: ${{ github.sha }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          expected="sha-$SHA"
          deadline=$((SECONDS + 600)) # 10 min bounded window
          probe() {
            resp="$(curl -sS -w '\n%{http_code}' --max-time 10 "$1/health" 2>/dev/null || true)"
            code="$(printf '%s' "$resp" | tail -1)"
            ver="$(printf '%s' "$resp" | sed '$d' | jq -r '.version // empty' 2>/dev/null || true)"
          }
          while (( SECONDS < deadline )); do
            probe https://staging.fluxvale.com; s_code="$code"; s_ver="$ver"
            probe https://fluxvale.com;         p_code="$code"; p_ver="$ver"
            echo "[${SECONDS}s] staging=$s_ver ($s_code) prod=$p_ver ($p_code) (want $expected 200)"
            if [ "$s_code" = 200 ] && [ "$s_ver" = "$expected" ] && [ "$p_code" = 200 ] && [ "$p_ver" = "$expected" ]; then
              echo "Readiness gate green: both environments serve $expected with 200"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Readiness gate timed out after 10 min: the deployed version never matched $expected with 200 on both envs (last: staging=$s_ver/$s_code prod=$p_ver/$p_code)"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_SERVICE_ACCOUNT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Readiness gate FAILED: sha-$SHA never served with 200 on both envs (staging=$s_ver/$s_code prod=$p_ver/$p_code) — $RUN_URL\", \"tags\": [\"deploy\", \"readiness\", \"failed\"]}" \
            || echo "annotation failed (Grafana unreachable?)"
          exit 1

  # The umbrella: branch protection requires THIS check. Runs regardless
  # of path gating; passes when every gated job succeeded or was skipped.
  # check-changes must SUCCEED, not merely skip: if it failed, its
  # dependents read "skipped" and the all() below would pass on zero
  # checks run — a green umbrella that proved nothing.
  wait-for-ci:
    name: Wait for CI
    needs: [check-changes, platform, cli-gates, cli-matrix, mcp-gates, tfprovider, docs-lint, skills-lint, linked-issues, e2e, deploy-image, watch-deploy, readiness-gate]

    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | map("\(.key): \(.value.result)") | .[]' >&2
          echo "$NEEDS" | jq -e '.["check-changes"].result == "success" and (del(.["check-changes"]) | all(.[]; .result == "success" or .result == "skipped"))' >/dev/null \
            && echo "All CI checks passed or were not needed" \
            || { echo "One or more CI jobs failed or were cancelled"; exit 1; }
