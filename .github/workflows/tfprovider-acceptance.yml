# The tfprovider's acceptance lane (#482): the framework acceptance
# tests (internal/provider/acceptance_test.go) against a REAL FluxVale
# org — real instances, real backups row, real gateway, real domain.
#
# NEVER per-PR: every run creates real, billing platform rows — the
# wallet shape follows e2e-nightly.yml (schedule + workflow_dispatch)
# plus tf-v* tags (release acceptance). PRs get the real-tofu smoke
# against a fake API instead (ci.yml's tfprovider lane).
#
# SECRETS NEED MINTING (the PA's todo, not a blocker for this
# workflow's landing):
#   TF_ACC_PAT — a staging PAT scoped instances:write backups:write
#     gateways:write + catalog:read, per docs/deployment.md. The
#     preflight below fails loud smoke-style until it exists, so the
#     nightly REDS rather than green-skips through proving nothing.
#   Plus, when their test classes should run (each skips with a notice
#   until then): the R2 backup coordinates (TF_ACC_BACKUP_* — the org
#   must have paid ONCE for backups), the tailnet pair
#   (TF_ACC_TAILNET_DOMAIN/TF_ACC_TAILSCALE_AUTH_KEY — NOTE: the
#   gateway has no API delete route, so its first acceptance run is a
#   standing monthly charge; later runs adopt the existing gateway),
#   and TF_ACC_DOMAIN for the domain class.
#
# The CLI driver: plugin-testing drives a terraform-shaped CLI —
# TF_ACC_TERRAFORM_PATH points at the mise-pinned tofu and
# TF_ACC_TERRAFORM_VERSION declares its version (the documented pair
# for OpenTofu; the path env also keeps the runner from hunting for a
# terraform binary that isn't installed).
name: tfprovider acceptance

on:
  schedule:
    - cron: "41 3 * * *" # nightly, off the top-of-hour rush + off e2e-nightly's 2:23
  workflow_dispatch:
  push:
    tags:
      - "tf-v*"

concurrency:
  group: tfprovider-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (staging)
    # schedule fires on main only by construction; dispatch may target
    # a branch (for validating changes to this file or the tests); tags
    # carry their own ref. Pull requests never enter — no such trigger.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/tf-v')
    runs-on: ubuntu-24.04
    # Two instances' deploy waits (10m poll deadlines), the gateway
    # provisioning wait, and the rest — the suite's worst case fits
    # under the go test timeout below; this is the job ceiling.
    timeout-minutes: 60
    env:
      # mise x must USE the installed tofu without auto-installing the
      # config's other pins (erlang = source compile, 15+ min — the
      # abandoned CI path in AGENTS.md)
      MISE_AUTO_INSTALL: "0"
    defaults:
      run:
        working-directory: apps/tfprovider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same single-source-of-truth shape as the ci.yml lane: parse the
      # Go version from mise.toml.
      - name: Read Go version from mise.toml
        id: go
        working-directory: .
        run: |
          version="$(sed -n 's/^go *= *"\([^"]*\)".*/\1/p' mise.toml)"
          echo "go=$version"
          test -n "$version"
          echo "go=$version" >>"$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.go }}
          cache-dependency-path: apps/tfprovider/go.sum

      # The mise pin, verified against mise.lock — same shape as the
      # e2e job (binaries only, the one tool this job needs).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install: false
      - run: mise install opentofu

      # A missing secret fails HERE with its own message — not as a
      # cryptic acceptance failure blaming the provider.
      - name: Preflight — secrets
        env:
          TF_ACC_PAT: ${{ secrets.TF_ACC_PAT }}
        run: |
          test -n "$TF_ACC_PAT" || { echo "::error::TF_ACC_PAT is not set — mint per docs/deployment.md (scopes instances:write backups:write gateways:write + catalog:read; the org must have paid once for backups)"; exit 1; }

      - name: Run the acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_API_URL: https://staging.fluxvale.com
          TF_ACC_PAT: ${{ secrets.TF_ACC_PAT }}
        run: |
          TF_ACC_TERRAFORM_PATH="$(mise which tofu)"
          TF_ACC_TERRAFORM_VERSION="$(mise x -- tofu version | head -1 | sed 's/^OpenTofu v//')"
          export TF_ACC_TERRAFORM_PATH TF_ACC_TERRAFORM_VERSION
          echo "driving tofu $(mise x -- tofu version | head -1) via $TF_ACC_TERRAFORM_PATH"
          mise x -- go test ./internal/provider -run 'TestAcc' -count=1 -timeout 50m -v