# Toolchain for the FluxVale platform app.
# Fleet-repo tooling (flux, kustomize, talosctl) lives in fluxvale/infrastructure, not here (ADR-0007).

[settings]
# mise.lock pins download URLs + checksums per platform, so installs are
# verified and identical on every machine/CI runner.
# NB: deliberately NOT setting `locked = true` here — it applies to all
# configs in scope, so teammates' global tools (not in this lockfile)
# would fail to install. CI should use the flag form instead:
#   MISE_LOCKED=1 mise install
# which fails if mise.lock is missing entries (npm-ci semantics).
lockfile = true

[tools]
# BEAM: fixed pins — the compiler/runtime pair must not drift
erlang = "28.5"
elixir = "1.20.4-otp-28"

# apps/e2e Playwright suites (ADR-0024)
node = "26.8.1"

# Local k3d + Tilt stack (ADR-0020)
k3d = "5.9.0"
tilt = "0.37.7"
# Latest release within kubectl's ±1-minor skew policy vs k3d 5.9.0's default
# server. Verified via `k3d version`: default = k3s v1.35.5, so 1.36.4 is
# +1 minor — supported. (NB: this is the binary's own self-report; older
# release notes mention a 1.32 bump predating the final release.)
# Pin the k3s image in the checked-in k3d config when it lands, and bump
# this alongside it.
kubectl = "1.36.4"
helm = "4.2.4" # charts in both envs (ADR-0020) — CNPG operator + Traefik via k8s_custom_deploy
